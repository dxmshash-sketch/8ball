name: Build APK Android
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pillow
      - run: python3 tools/build.py
      - run: npm test
      - run: npm install
      - run: npx cap add android
      - run: python3 tools/android_patch.py
      - run: npx cap sync android

      # ─────────────────────────────────────────────
      # Siapkan debug keystore di lokasi default Gradle
      # (~/.android/debug.keystore) sehingga TIDAK perlu
      # patch build.gradle — AGP otomatis pakai file ini.
      # ─────────────────────────────────────────────
      - name: Siapkan debug keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          mkdir -p ~/.android
          KS=~/.android/debug.keystore

          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$KS"
            echo "✓ debug.keystore permanen terpasang (dari secret)"
          else
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 kosong — generate keystore sementara"
            echo "::warning::SHA-1 akan berubah tiap build. Lihat catatan di bawah untuk SHA-1 stabil."
            keytool -genkeypair -v \
              -keystore "$KS" \
              -alias androiddebugkey \
              -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # ─────────────────────────────────────────────
      # Print SHA-1 / SHA-256 untuk didaftarkan di Firebase
      # (continue-on-error: TIDAK akan menggagalkan build)
      # ─────────────────────────────────────────────
      - name: Print SHA-1 & SHA-256
        continue-on-error: true
        run: |
          echo "==============================="
          echo " SHA-1 / SHA-256 untuk Firebase"
          echo "==============================="
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android \
            | grep -E "SHA1:|SHA256:" \
            || echo "(tidak bisa baca keystore — diabaikan)"
          echo "==============================="
          echo "Copy SHA1 di atas → Firebase Console → Project Settings → Your apps → Add fingerprint"
          echo "==============================="

      # ─────────────────────────────────────────────
      # Tambah google-services.json dari secret
      # ─────────────────────────────────────────────
      - name: Tambah google-services.json (dari secret)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON kosong!"
            exit 1
          fi
          echo "$GS" | base64 -d > android/app/google-services.json
          python3 -c "
          import json
          d = json.load(open('android/app/google-services.json'))
          pkg = d['client'][0]['client_info']['android_client_info']['package_name']
          assert pkg == 'com.pantul.game', f'package_name salah: {pkg}'
          print(f'✓ google-services.json valid, package: {pkg}')
          "

      # ─────────────────────────────────────────────
      # Build APK
      # ─────────────────────────────────────────────
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk pantul.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pantul-apk
          path: pantul.apk

      - name: Lampirkan ke Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pantul.apk
          generate_release_notes: true