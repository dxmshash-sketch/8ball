const AVATAR_REWARDS = ['sym:crown', 'frame:bronze', 'sym:flame', 'frame:silver', 'sym:bolt', 'frame:gold', 'sym:diamond', 'frame:emerald', 'sym:shield', 'frame:ruby', 'sym:clover', 'frame:diamond', 'sym:moon', 'frame:neon', 'sym:sun'];
function rewardsForLevel(L) {
  if (L < 2) return [];
  const items = [{ type: 'coins', amount: 2000 + 1500 * (L - 1) + (L % 5 === 0 ? 5000 : 0) }];
  if (L % 5 === 0) items.push({ type: 'cue', id: CUE_REWARDS[(L / 5 - 1) % CUE_REWARDS.length] });
  if (L % 7 === 0) items.push({ type: 'table', id: TABLE_REWARDS[(L / 7 - 1) % TABLE_REWARDS.length] });
  if (L % 3 === 0) items.push({ type: 'avatar', id: AVATAR_REWARDS[(L / 3 - 1) % AVATAR_REWARDS.length] });
  return items;
}

/** Avatar bot: deterministik dari nama. */
function botAvatar(name) {
  let h = 7; for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  const syms = Object.keys(SYMBOLS).filter((k) => k !== 'trophy'), frames = ['none', 'none', 'bronze', 'silver', 'gold'];
  return { sym: syms[h % syms.length], color: (h >>> 3) % AVATAR_COLORS.length, frame: frames[(h >>> 6) % frames.length] };
}

/* =====================================================================
   10 · STORE — profil, ekonomi (BCPOOL), level, hadiah, koleksi, konten kustom.
   ===================================================================== */
const todayKey = (d) => { d = d || new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };

class Store {
  constructor() {
    this.key = 'pantul.v3'; this.customKey = 'pantul.custom.v1'; this.imgCache = new Map(); this.listeners = [];
    this.data = {
      profile: { name: 'Pemain', coins: START_COINS, xp: 0, avatar: { sym: 'ball8', color: 0, frame: 'none' }, badge: null, created: Date.now() },
      stats: { matches: 0, wins: 0, losses: 0, streak: 0, bestStreak: 0, potted: 0, maxBetWon: 0, totalWon: 0, totalLost: 0 },
      progress: { claimedLevel: 1, dailyLast: null, dailyStreak: 0, helpLast: 0 },
      unlocks: { avatars: FREE_AVATAR_ITEMS.slice(), badges: [] },
      cues: { equipped: 'maple', owned: { maple: 1 } },
      tables: { equipped: 'klasik', owned: ['klasik'] },
      settings: { sfx: true, music: false, aimAssist: true, showBounce: true, aimZoom: 1 },
    };
    this.custom = { cues: [], tables: [] };
    try {
      const raw = window.localStorage.getItem(this.key);
      if (raw) { const d = JSON.parse(raw); for (const k of Object.keys(this.data)) this.data[k] = Object.assign(this.data[k], d[k] || {}); }
      const c = window.localStorage.getItem(this.customKey); if (c) this.custom = Object.assign(this.custom, JSON.parse(c));
    } catch (e) { /* penyimpanan tidak tersedia: pakai memori */ }
  }
  onChange(fn) { this.listeners.push(fn); }
  _emit(what) { for (const fn of this.listeners) fn(what); }
  save() { try { window.localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { /* abaikan */ } }
  saveCustom() { try { window.localStorage.setItem(this.customKey, JSON.stringify(this.custom)); return true; } catch (e) { return false; } }

  /* ------------ ekonomi & level ------------ */
  get coins() { return this.data.profile.coins; }
  level() { return levelInfo(this.data.profile.xp).level; }
  progress() { return levelInfo(this.data.profile.xp); }
  addCoins(n) { this.data.profile.coins += n; this.save(); this._emit('coins'); }
  spend(n) { if (n < 0 || this.data.profile.coins < n) return false; this.data.profile.coins -= n; this.save(); this._emit('coins'); return true; }

  /** Dipanggil setelah pertandingan (mode bertaruh). Taruhan sudah dipotong saat mulai. */
  recordMatch(r) {
    const p = this.data.profile, s = this.data.stats, prevXp = p.xp, prevLevel = levelInfo(prevXp).level, bet = r.bet || 0;
    let payout = 0;
    s.matches++;
    if (r.youWon) { s.wins++; s.streak++; s.bestStreak = Math.max(s.bestStreak, s.streak); payout = Math.floor(bet * 2 * (1 - HOUSE_FEE)); p.coins += payout; s.totalWon += payout - bet; s.maxBetWon = Math.max(s.maxBetWon, bet); }
    else { s.losses++; s.streak = 0; s.totalLost += bet; }
    s.potted += r.potted || 0;
    const lg = Math.log10(Math.max(100, bet));
    const xpGain = r.youWon ? 40 + Math.round(lg * 12) : 15 + Math.round(lg * 4);
    p.xp += xpGain;
    const newBadges = this._checkBadges();
    this.save(); this._emit('coins');
    return { bet, payout, net: r.youWon ? payout - bet : -bet, xpGain, prevXp, newXp: p.xp, prevLevel, newLevel: levelInfo(p.xp).level, newBadges };
  }
  _checkBadges() {
    const out = [];
    for (const b of BADGE_DEFS) if (this.data.unlocks.badges.indexOf(b.id) === -1 && b.check(this.data.stats, this.data.profile, this)) { this.data.unlocks.badges.push(b.id); out.push(b); }
    return out;
  }
  checkBadges() { const n = this._checkBadges(); if (n.length) this.save(); return n; }

  /* ------------ hadiah level & harian ------------ */
  claimableLevels() {
    const out = [], lv = this.level();
    for (let l = this.data.progress.claimedLevel + 1; l <= lv; l++) out.push({ level: l, items: rewardsForLevel(l) });
    return out;
  }
  hasClaimable() { return this.claimableLevels().length > 0 || this.dailyStatus().available; }
  claimAllLevels() {
    const list = this.claimableLevels(), items = [];
    for (const r of list) { for (const it of r.items) { this.grant(it); items.push(it); } this.data.progress.claimedLevel = r.level; }
    this.save(); return { list, items };
  }
  claimLevel(l) {
    if (l !== this.data.progress.claimedLevel + 1 || l > this.level()) return null;
    const items = rewardsForLevel(l); for (const it of items) this.grant(it);
    this.data.progress.claimedLevel = l; this.save(); return items;
  }
  grant(it) {
    if (it.type === 'coins') this.data.profile.coins += it.amount;
    else if (it.type === 'cue') this.data.cues.owned[it.id] = this.data.cues.owned[it.id] || 1;
    else if (it.type === 'table') { if (this.data.tables.owned.indexOf(it.id) === -1) this.data.tables.owned.push(it.id); }
    else if (it.type === 'avatar') { if (this.data.unlocks.avatars.indexOf(it.id) === -1) this.data.unlocks.avatars.push(it.id); }
    this._emit('coins');
  }
  dailyStatus(now) {
    const pr = this.data.progress, today = todayKey(now), y = new Date(now || Date.now()); y.setDate(y.getDate() - 1);
    const avail = pr.dailyLast !== today;
    const nextStreak = pr.dailyLast === todayKey(y) ? pr.dailyStreak + 1 : 1;
    const day = avail ? (nextStreak - 1) % 7 : (pr.dailyStreak - 1 + 7) % 7;
    return { available: avail, day, streak: avail ? nextStreak : pr.dailyStreak, amount: DAILY_REWARDS[day] };
  }
  claimDaily(now) {
    const st = this.dailyStatus(now); if (!st.available) return null;
    this.data.progress.dailyLast = todayKey(now); this.data.progress.dailyStreak = st.streak;
    this.addCoins(st.amount); return st.amount;
  }
  helpAvailable() { return this.coins < 500 && Date.now() - this.data.progress.helpLast > 10 * 60 * 1000; }
  claimHelp() { if (!this.helpAvailable()) return 0; this.data.progress.helpLast = Date.now(); this.addCoins(3000); return 3000; }

  /* ------------ avatar & badge ------------ */
  avatarUnlocked(id) { return this.data.unlocks.avatars.indexOf(id) !== -1; }
  setAvatar(part, value) {
    const a = this.data.profile.avatar;
    if (part === 'color') a.color = value;
    else if (this.avatarUnlocked(part + ':' + value)) a[part] = value; else return false;
    this.save(); this._emit('avatar'); return true;
  }
  equipBadge(id) { if (id === null || this.data.unlocks.badges.indexOf(id) !== -1) { this.data.profile.badge = id; this.save(); this._emit('avatar'); return true; } return false; }

  /* ------------ cue ------------ */
  allCues() {
    return CUE_CATALOG.concat(this.custom.cues.map((c) => {
      const base = CUE_CATALOG.find((x) => x.id === c.base) || CUE_CATALOG[0];
      return { id: c.id, name: c.name, rarity: c.rarity || 'Epic', tags: ['Kustom'], stats: this.effectiveStats(base.id, this.ownedLevel(base.id) || 1), collectionPoints: { unlock: 0, upgrade: 0 }, price: 0, image: c.image, custom: true };
    }));
  }
  cueDefById(id) { return this.allCues().find((c) => c.id === id) || CUE_CATALOG[0]; }
  ownedLevel(id) { if (this.custom.cues.some((c) => c.id === id)) return 1; return this.data.cues.owned[id] || 0; }
  effectiveStats(id, level) {
    const c = CUE_CATALOG.find((x) => x.id === id) || CUE_CATALOG[0], out = {};
    for (const k of Object.keys(c.stats)) out[k] = Math.min(10, c.stats[k] + (level - 1) * 2);
    return out;
  }
  cueStats() {
    const id = this.data.cues.equipped, c = this.cueDefById(id), out = {};
    if (c.custom) return c.stats;
    return this.effectiveStats(id, this.ownedLevel(id) || 1);
  }
  upgradePrice(id) { const c = CUE_CATALOG.find((x) => x.id === id); return Math.round(Math.max(3000, c.price * 0.35) * this.ownedLevel(id)); }
  unlockCue(id) {
    const c = CUE_CATALOG.find((x) => x.id === id);
    if (!c || this.ownedLevel(id) || !this.spend(c.price)) return false;
    this.data.cues.owned[id] = 1; this.checkBadges(); this.save(); return true;
  }
  upgradeCue(id) {
    const lv = this.ownedLevel(id);
    if (!lv || lv >= MAX_CUE_LEVEL || !this.spend(this.upgradePrice(id))) return false;
    this.data.cues.owned[id] = lv + 1; this.save(); return true;
  }
  equipCue(id) { if (this.ownedLevel(id)) { this.data.cues.equipped = id; this.save(); this._emit('cue'); return true; } return false; }
  cueImage(id) {
    if (!this.imgCache.has(id)) { const im = new Image(); im.src = this.cueDefById(id).image; this.imgCache.set(id, im); }
    return this.imgCache.get(id);
  }

  /* ------------ tema meja ------------ */
  allThemes() { return TABLE_THEMES.concat(this.custom.tables.map((t) => Object.assign({ rarity: 'Kustom', price: 0, custom: true }, t))); }
  themeDef(id) { return this.allThemes().find((t) => t.id === id) || TABLE_THEMES[0]; }
  themeOwned(id) { return this.data.tables.owned.indexOf(id) !== -1 || this.custom.tables.some((t) => t.id === id); }
  buyTable(id) {
    const t = TABLE_THEMES.find((x) => x.id === id);
    if (!t || this.themeOwned(id) || !this.spend(t.price)) return false;
    this.data.tables.owned.push(id); this.save(); return true;
  }
  equipTable(id) { if (this.themeOwned(id)) { this.data.tables.equipped = id; this.save(); this._emit('table'); return true; } return false; }

  /* ------------ konten kustom (halaman Developer) ------------ */
  addCustomCue(c) { this.custom.cues.push(c); if (!this.saveCustom()) { this.custom.cues.pop(); return false; } return true; }
  addCustomTable(t) { this.custom.tables.push(t); if (!this.saveCustom()) { this.custom.tables.pop(); return false; } return true; }
  removeCustom(kind, id) {
    const arr = this.custom[kind]; const i = arr.findIndex((x) => x.id === id); if (i < 0) return;
    arr.splice(i, 1); this.saveCustom();
    if (kind === 'cues' && this.data.cues.equipped === id) this.data.cues.equipped = 'maple';
    if (kind === 'tables' && this.data.tables.equipped === id) this.data.tables.equipped = 'klasik';
    this.save(); this._emit('table');
  }
  exportCustom() { return JSON.stringify({ format: 'pantul-skins', version: 1, cues: this.custom.cues, tables: this.custom.tables }); }
  importCustom(text) {
    let d; try { d = JSON.parse(text); } catch (e) { return { ok: false, error: 'JSON tidak valid' }; }
    if (!d || d.format !== 'pantul-skins') return { ok: false, error: 'Bukan berkas skin Pantul' };
    let n = 0;
    for (const c of d.cues || []) if (c.image && String(c.image).startsWith('data:image/') && !this.custom.cues.some((x) => x.id === c.id)) { this.custom.cues.push({ id: String(c.id), name: String(c.name || 'Cue'), rarity: c.rarity || 'Epic', base: c.base || 'maple', image: c.image }); n++; }
    for (const t of d.tables || []) if (t.cloth && t.cushion && t.rail && !this.custom.tables.some((x) => x.id === t.id)) { this.custom.tables.push(t); n++; }
    if (!this.saveCustom()) return { ok: false, error: 'Penyimpanan penuh' };
    return { ok: true, count: n };
  }
  resetAll() { try { window.localStorage.removeItem(this.key); window.localStorage.removeItem(this.customKey); } catch (e) { /* abaikan */ } }
}

/* =====================================================================
   11 · LEADERBOARD — antarmuka layanan + implementasi simulasi lokal.
   Untuk peringkat sungguhan, buat kelas dengan method fetch(kind) yang
   memanggil server, lalu ganti MockLeaderboard di 16-main.js.
   ===================================================================== */
const LB_FIRST = ['Raka', 'Sari', 'Bima', 'Dewi', 'Fajar', 'Ayu', 'Kevin', 'Nadya', 'Rizky', 'Tasya', 'Dimas', 'Putri', 'Arif', 'Intan', 'Yoga', 'Mega', 'Bayu', 'Citra', 'Eko', 'Lina', 'Andi', 'Wulan', 'Hadi', 'Salsa', 'Rendra', 'Vina', 'Galih', 'Nia', 'Toni', 'Maya'];
const LB_TAIL = ['_pool', '88', 'ID', '.Pro', '_cue', '77', 'Ace', '_8ball', 'King', '01', 'X', '_shot', 'Jaya', '99'];

class MockLeaderboard {
  constructor(store) { this.store = store; }
  /** kind: 'coins' | 'level' | 'wins'. Data disusun deterministik per minggu agar konsisten antar pembukaan. */
  fetch(kind) {
    const week = Math.floor(Date.now() / (7 * 86400000)), rng = new Rng(week * 2654435761 >>> 0), rows = [], used = new Set();
    while (rows.length < 60) {
      const name = LB_FIRST[rng.int(LB_FIRST.length)] + LB_TAIL[rng.int(LB_TAIL.length)];
      if (used.has(name)) continue; used.add(name);
      const skill = Math.pow(rng.next(), 2.2);                           // sedikit pemain sangat kuat
      const level = 1 + Math.floor(skill * 58), wins = Math.floor(8 + skill * 2600 * (0.5 + rng.next()));
      const coins = Math.floor(20000 * Math.pow(10, skill * 3.6 + rng.range(-0.15, 0.25)));
      rows.push({ name, level, wins, coins, avatar: botAvatar(name), isYou: false });
    }
    const p = this.store.data.profile, s = this.store.data.stats;
    rows.push({ name: p.name, level: this.store.level(), wins: s.wins, coins: p.coins, avatar: p.avatar, badge: p.badge, isYou: true });
    rows.sort((a, b) => b[kind] - a[kind]);
    rows.forEach((r, i) => { r.rank = i + 1; r.value = r[kind]; });
    return rows;
  }
}

/* =====================================================================
   12 · RENDER — meja bertema, bola, cue, kamera.
   Portrait: meja diputar 90° agar sisi panjang mengisi layar. Saat membidik kamera
   mendekat (zoom) ke area bola putih → target. Geometri meja = geometri collision.
   ===================================================================== */
class BallSprites {
  constructor() { this.sprites = []; this.size = 0; this.ppu = 1; this.digits = []; this.colors = []; this.Lx = -0.46; this.Ly = -0.56; }
  build(ppu, rot) {
    const R = CONFIG.table.ballRadius; this.ppu = ppu; this.size = Math.ceil(2 * R * ppu) + 2; this.sprites = [];
    const c = Math.cos(rot), s = Math.sin(rot);                          // cahaya layar (kiri-atas) → koordinat dunia
    this.Lx = -0.46 * c + -0.56 * s; this.Ly = 0.46 * s + -0.56 * c;
    for (let i = 0; i < 16; i++) { const cv = document.createElement('canvas'); cv.width = cv.height = this.size; const ctx = cv.getContext('2d'); this.sprites.push({ cv, ctx, img: ctx.createImageData(this.size, this.size) }); }
    this.colors = CONFIG.colors.balls.map((h) => (h ? Util.hexToRgb(h) : null));
    for (let i = 1; i <= 15; i++) {
      const cv = document.createElement('canvas'); cv.width = cv.height = 32;
      const x = cv.getContext('2d'); x.fillStyle = '#000'; x.textAlign = 'center'; x.textBaseline = 'middle';
      x.font = 'bold ' + (i < 10 ? 25 : 19) + 'px Arial, Helvetica, sans-serif'; x.fillText(String(i), 16, 17);
      const d = x.getImageData(0, 0, 32, 32).data, a = new Uint8Array(1024); for (let k = 0; k < 1024; k++) a[k] = d[k * 4 + 3]; this.digits[i] = a;
    }
  }
  render(ball) {
    const sp = this.sprites[ball.id], S = this.size, data = sp.img.data, m = ball.orient, id = ball.id, half = S / 2, Rp = half - 1;
    const base = id === 0 ? [246, 246, 240] : this.colors[id <= 8 ? id : id - 8], stripe = id > 8, cueBall = id === 0;
    const Lx = this.Lx, Ly = this.Ly, Lz = -0.69, hl = Math.sqrt(Lx * Lx + Ly * Ly + (Lz - 1) * (Lz - 1)), Hx = Lx / hl, Hy = Ly / hl, Hz = (Lz - 1) / hl, dig = this.digits[id];
    for (let py = 0; py < S; py++) for (let px = 0; px < S; px++) {
      const o = (py * S + px) * 4, nx0 = (px + 0.5 - half) / Rp, ny0 = (py + 0.5 - half) / Rp, d2 = nx0 * nx0 + ny0 * ny0, dist = Math.sqrt(d2);
      const alpha = Util.clamp((1 - dist) * Rp + 0.5, 0, 1);
      if (alpha <= 0) { data[o + 3] = 0; continue; }
      let nx = nx0, ny = ny0; if (d2 > 1) { nx /= dist; ny /= dist; }
      const nz = -Math.sqrt(Math.max(0, 1 - nx * nx - ny * ny));
      const bx = m[0] * nx + m[3] * ny + m[6] * nz, by = m[1] * nx + m[4] * ny + m[7] * nz, bz = m[2] * nx + m[5] * ny + m[8] * nz;
      let r, g, b;
      if (cueBall) { r = 246; g = 246; b = 240; const dot = Math.max(Math.abs(bx), Math.abs(by)); if (dot > 0.965) { const k = Util.smooth((dot - 0.965) / 0.02); r += (196 - r) * k; g += (52 - g) * k; b += (48 - b) * k; } }
      else {
        const white = 246;
        if (stripe) { const k = Util.smooth((0.52 - Math.abs(by)) / 0.05); r = white + (base[0] - white) * k; g = white + (base[1] - white) * k; b = white + (base[2] - white) * k; }
        else { r = base[0]; g = base[1]; b = base[2]; }
        const ax = Math.abs(bx);

class Fx {
  constructor(canvas) { this.cv = canvas; this.ctx = canvas.getContext('2d'); this.p = []; this.on = false; }
  burst(x, y, n, spread) {
    const cols = ['#F4C542', '#fff2b0', '#32D74B', '#57BFEA', '#FF5A5F', '#d99cff'];
    for (let i = 0; i < n; i++) { const a = Math.random() * Math.PI * 2, s = (2 + Math.random() * 9) * (spread || 1); this.p.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 4, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.4, w: 5 + Math.random() * 6, h: 3 + Math.random() * 5, life: 1, c: cols[i % cols.length] }); }
    if (!this.on) { this.on = true; this._resize(); requestAnimationFrame((t) => this._loop(t)); }
  }
  _resize() { const d = Math.min(window.devicePixelRatio || 1, 2); this.cv.width = innerWidth * d; this.cv.height = innerHeight * d; this.d = d; }
  _loop() {
    const c = this.ctx, d = this.d; c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, this.cv.width, this.cv.height); c.setTransform(d, 0, 0, d, 0, 0);
    for (const q of this.p) { q.vy += 0.28; q.x += q.vx; q.y += q.vy; q.vx *= 0.985; q.r += q.vr; q.life -= 0.011; c.save(); c.globalAlpha = Math.max(0, q.life); c.translate(q.x, q.y); c.rotate(q.r); c.fillStyle = q.c; c.fillRect(-q.w / 2, -q.h / 2, q.w, q.h); c.restore(); }
    this.p = this.p.filter((q) => q.life > 0 && q.y < innerHeight + 40);
    if (this.p.length) requestAnimationFrame(() => this._loop()); else { this.on = false; c.setTransform(1, 0, 0, 1, 0, 0); c.clearRect(0, 0, this.cv.width, this.cv.height); }
  }
}

const PAGE_SCREENS = { menu: 'screenMenu', modes: 'screenModes', settings: 'screenSettings', profile: 'screenProfile', rewards: 'screenRewards', board: 'screenBoard', tables: 'screenTables', cues: 'screenCues', dev: 'screenDev' };

  constructor(store, audio) {

    document.querySelectorAll('[data-go]').forEach((b) => b.addEventListener('click', () => { this.click(); this.go(b.dataset.go); }));

    $('btnHelp').addEventListener('click', () => { this.click(); const n = this.store.claimHelp(); if (n) { this.toast('+' + fmtCoins(n) + ' ' + COIN_NAME + ' diterima', 'ok'); this.fx.burst(innerWidth / 2, innerHeight / 2, 60); this.refreshMenu(); } });
    $('btnPause').addEventListener('click', () => { this.click(); game.setPaused(true); });
    $('btnResume').addEventListener('click', () => { this.click(); game.setPaused(false); });
    $('btnPauseSettings').addEventListener('click', () => { this.click(); this.go('settings'); });
    $('btnSettingsBack').addEventListener('click', () => { this.click(); this.store.save(); this.back(); });
    $('btnRestart').addEventListener('click', () => { this.click(); if (!game.restartMatch()) { this.toast('Saldo tidak cukup untuk taruhan yang sama', 'foul'); this.go('modes'); } });
    $('btnQuit').addEventListener('click', () => { this.click(); game.quitToMenu(); });
    $('btnDisc').addEventListener('click', () => { this.click(); if (game.simulateDisconnect()) game.setPaused(false); });
    document.querySelectorAll('.switch').forEach((sw) => sw.addEventListener('click', () => {

    this.store.onChange((what) => { if (what === 'table') this.renderer.applyTheme(); if (what === 'coins' || what === 'avatar') this.refreshMenu(); });

/* =====================================================================
   INPUT — mouse/touch/keyboard (koordinat lewat kamera renderer, sehingga portrait & zoom ikut benar)
   ===================================================================== */
class InputController {
  constructor(canvas, game, renderer, ui) {
    this.canvas = canvas; this.game = game; this.r = renderer; this.ui = ui; this.mode = 'none';
    this.startPointer = 0; this.startAim = 0; this.charging = false; this.chargeT = 0;
    canvas.addEventListener('pointerdown', (e) => this.down(e)); canvas.addEventListener('pointermove', (e) => this.move(e));
    canvas.addEventListener('pointerup', () => this.up()); canvas.addEventListener('pointercancel', () => this.up());
    canvas.addEventListener('wheel', (e) => { if (game.canControl()) { e.preventDefault(); game.setPower(game.aim.power - Math.sign(e.deltaY) * 0.03); } }, { passive: false });
    window.addEventListener('keydown', (e) => this.key(e, true)); window.addEventListener('keyup', (e) => this.key(e, false));
  }
  _world(e, lift) { return this.r.screenToWorld(e.clientX, e.clientY - (lift ? 54 : 0)); }
  down(e) {
    this.ui.audio.unlock(); const g = this.game;
    if (g.paused || (!g.canControl() && !g.canPlace())) return;
    const touch = e.pointerType !== 'mouse', w = this._world(e, false), cue = g.cue;
    const nearCue = Math.hypot(w.x - cue.x, w.y - cue.y) < CONFIG.table.ballRadius * 3.2;
    if (g.canPlace() && (g.state === GameState.BALL_IN_HAND || nearCue)) { this.mode = 'place'; this.canvas.setPointerCapture(e.pointerId); const p = this._world(e, touch); g.moveCue(p.x, p.y); return; }
    if (!g.canControl()) return;
    this.mode = 'aim'; this.canvas.setPointerCapture(e.pointerId); this.startPointer = Math.atan2(w.y - cue.y, w.x - cue.x); this.startAim = g.aim.angle;
    if (!touch) g.setAimAngle(this.startPointer);
  }
  move(e) {
    const g = this.game, touch = e.pointerType !== 'mouse'; if (g.paused) return;
    if (this.mode === 'place') { const p = this._world(e, touch); g.moveCue(p.x, p.y); return; }
    if (!g.canControl()) return;
    const w = this._world(e, false), cue = g.cue, d = Math.hypot(w.x - cue.x, w.y - cue.y);
    if (!touch) { if (d > CONFIG.table.ballRadius * 1.6 && (this.mode === 'aim' || e.buttons === 0)) g.setAimAngle(Math.atan2(w.y - cue.y, w.x - cue.x)); return; }
    if (this.mode === 'aim' && d > CONFIG.table.ballRadius * 2) g.setAimAngle(this.startAim + Util.wrapAngle(Math.atan2(w.y - cue.y, w.x - cue.x) - this.startPointer) * 0.55);
  }
  up() { if (this.mode === 'place' && this.game.state === GameState.BALL_IN_HAND) this.game.confirmPlacement(); this.mode = 'none'; }
  key(e, down) {
    const g = this.game; if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT')) return;
    if (down && e.code === 'Escape') { if (g.isActiveMatch()) g.setPaused(!g.paused); return; }
    if (g.paused) return;
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight') { if (down) g.nudgeAim((e.code === 'ArrowLeft' ? -1 : 1) * (e.shiftKey ? CONFIG.aim.keyStepFine : CONFIG.aim.keyStep)); e.preventDefault(); }
    else if (e.code === 'ArrowUp' || e.code === 'ArrowDown') { if (down) g.setPower(g.aim.power + (e.code === 'ArrowUp' ? -0.04 : 0.04)); e.preventDefault(); }
    else if (e.code === 'Space') { e.preventDefault(); if (down && !this.charging && g.canControl()) { this.charging = true; this.chargeT = 0; g.aim.power = 0.02; } else if (!down && this.charging) { this.charging = false; g.requestShot(); } }
    else if (down && e.code === 'Enter') g.requestShot();
  }
  update(dt) { if (this.charging) { this.chargeT += dt; this.game.setPower(this.chargeT / 1.3); } }
}

    return '<div class="dev-list">' + items.map((x) => '<div class="dev-item">' + (kind === 'cues' ? '<img alt="" src="' + x.image + '">' : '<span class="tprev" style="width:90px;height:28px;display:block;background:linear-gradient(90deg,' + x.cloth.a + ',' + x.cloth.c + ');border-radius:4px"></span>') + '<span>' + esc(x.name) + '</span><button class="btn small" data-act="use" data-k="' + kind + '" data-v="' + x.id + '">Pakai</button><button class="btn small danger" data-act="del" data-k="' + kind + '" data-v="' + x.id + '">Hapus</button></div>').join('') + '</div>';
  },
  _bindDev(el, D) {
    const st = this.store, redo = () => this.render_dev();
    this._bind(el, {
      tab: (d) => { D.tab = d.v; redo(); },
      saveCue: () => {
        if (!D.cueCanvas) { this.toast('Pilih gambar cue dulu', 'foul'); return; }
        const name = ($('dvCueName').value.trim() || 'Cue Kustom').slice(0, 24), image = D.cueCanvas.toDataURL('image/png');
        if (image.length > 1.2e6) { this.toast('Gambar terlalu besar — sederhanakan gambar', 'foul'); return; }
        const ok = st.addCustomCue({ id: 'c_' + Date.now().toString(36), name, rarity: $('dvRar').value, base: $('dvBase').value, image });
        this.toast(ok ? 'Skin cue disimpan' : 'Penyimpanan penuh — hapus skin lama', ok ? 'ok' : 'foul'); if (ok) { D.cueCanvas = null; redo(); }
      },
      saveTable: () => {
        const th = this._devTheme(); th.id = 't_' + Date.now().toString(36); th.name = ($('dvTName').value.trim() || 'Meja Kustom').slice(0, 24);
        if (D.clothData) th.clothImage = D.clothData; if (D.railData) th.railImage = D.railData;
        const ok = st.addCustomTable(th); this.toast(ok ? 'Tema meja disimpan' : 'Penyimpanan penuh — hapus skin lama', ok ? 'ok' : 'foul'); if (ok) redo();
      },
      use: (d) => { if (d.k === 'cues') st.equipCue(d.v); else st.equipTable(d.v); this.toast('Skin dipakai', 'ok'); },
      del: (d) => { st.removeCustom(d.k, d.v); redo(); },
      clearImgs: () => { D.clothImg = D.railImg = D.clothData = D.railData = null; this._devTablePreview(); },
      tplCloth: () => this._downloadTemplate('cloth'), tplFrame: () => this._downloadTemplate('frame'),
      copy: () => { const t = $('dvExport'); t.select(); try { navigator.clipboard.writeText(t.value); this.toast('Disalin', 'ok'); } catch (e) { document.execCommand('copy'); } },
      download: () => downloadBlob(new Blob([st.exportCustom()], { type: 'application/json' }), 'pantul-skins.json'),
      import: () => { const r = st.importCustom($('dvImport').value); this.toast(r.ok ? r.count + ' skin diimpor' : r.error, r.ok ? 'ok' : 'foul'); if (r.ok) redo(); },
      wipe: () => { st.custom.cues = []; st.custom.tables = []; st.saveCustom(); st.data.cues.equipped = st.ownedLevel(st.data.cues.equipped) ? st.data.cues.equipped : 'maple'; st.data.tables.equipped = st.themeOwned(st.data.tables.equipped) ? st.data.tables.equipped : 'klasik'; st.save(); this.toast('Skin kustom dihapus', 'ok'); redo(); },
    });
    const onFile = (id, fn) => { const f = $(id); if (f) f.addEventListener('change', async () => { if (!f.files[0]) return; try { await fn(await readImageFile(f.files[0]), f.files[0]); } catch (e) { this.toast(e.message, 'foul'); } }); };
    if (D.tab === 'cue') {
      const build = () => { if (D.cueSrc) { D.cueCanvas = buildCueCanvas(D.cueSrc, D.flip); this._devCuePreview(); } };
      onFile('dvCueFile', (img) => { D.cueSrc = img; build(); });
      $('dvFlip').addEventListener('change', (e) => { D.flip = e.target.checked; build(); });
      this._devCuePreview();
    } else if (D.tab === 'table') {
      const upd = () => this._devTablePreview(), fields = ['dvSight', 'dvCl1', 'dvCl2', 'dvCu', 'dvR1', 'dvR2', 'dvR3'], keys = ['sight', 'cl1', 'cl2', 'cu', 'r1', 'r2', 'r3'];
      fields.forEach((id, i) => $(id).addEventListener('input', (e) => { D[keys[i]] = e.target.value; clearTimeout(this._dt); this._dt = setTimeout(upd, 90); }));
      $('dvStyle').addEventListener('change', (e) => { D.style = e.target.value; const L = RAIL_LABELS[D.style]; ['lbR1', 'lbR2', 'lbR3'].forEach((id, i) => { $(id).firstChild.nodeValue = L[i]; }); upd(); });
      onFile('dvClothFile', (img) => { D.clothImg = img; D.clothData = fitDataURL(img, 1024, 482, 0.82); upd(); });
      onFile('dvRailFile', (img) => { D.railImg = img; D.railData = fitDataURL(img, 1024, 517, 0.82); upd(); });
      upd();
    } else {
      $('dvExport').value = st.exportCustom();
      const f = $('dvImpFile'); f.addEventListener('change', () => { if (f.files[0]) f.files[0].text().then((t) => { $('dvImport').value = t; }); });
    }
  },
  _devCuePreview() {
    const D = this.dev, cv = $('dvCuePrev'); if (!cv) return; const c = cv.getContext('2d'); c.clearRect(0, 0, 1200, 120);
    if (D.cueCanvas) c.drawImage(D.cueCanvas, 0, 0);
    else { c.fillStyle = '#6b7484'; c.font = '28px sans-serif'; c.textAlign = 'center'; c.fillText('Pilih gambar cue…', 600, 70); }
    const th = this.store.themeDef(this.store.data.tables.equipped), tcv = $('dvCueTable');
    loadThemeImages(th, (imgs) => {
      const base = renderTablePreview(th, 900, imgs); tcv.width = base.width; tcv.height = base.height; const t = tcv.getContext('2d'); t.drawImage(base, 0, 0);
      if (!D.cueCanvas) return;
      const T = CONFIG.table, tx = T.rail + T.cushion + 46, s = base.width / (T.width + 2 * tx), R = T.ballRadius, L = T.width * CONFIG.aim.cueLengthRatio, h = L * 0.1 * 0.62, off = R + CONFIG.aim.cueGap + 40;
      const bx = (tx + T.headStringX) * s, by = (tx + T.height / 2) * s;
      t.drawImage(D.cueCanvas, bx - (off + L) * s, by - h * s / 2, L * s, h * s);
      t.fillStyle = '#f6f6f0'; t.beginPath(); t.arc(bx, by, R * s, 0, 7); t.fill(); t.strokeStyle = 'rgba(0,0,0,.35)'; t.lineWidth = 1; t.stroke();
    });
  },
  _devTheme() {
    const D = this.dev, sy = D.style || 'wood', g = (k, d) => D[k] || d;
    const cl1 = g('cl1', '#86d9f6'), cl2 = g('cl2', '#2d8dbd'), cu = g('cu', '#63c6f0'), r1 = g('r1', '#a83232'), r2 = g('r2', '#8a2426'), r3 = g('r3', '#671719');
    let rail;
    if (sy === 'neon') rail = { style: 'neon', bg: r1, glow: r2 };
    else if (sy === 'ornate') rail = { style: 'ornate', bg: r1, ink: r2, spot: r3, edge: shadeHex(r2, -0.3) };
    else if (sy === 'metal') rail = { style: 'metal', a: r1, b: r2, c: r3 };
    else rail = { style: 'wood', a: r1, accent: shadeHex(r1, 0.15), b: r2, c: r3, d: shadeHex(r3, -0.4) };
    return { name: 'Pratinjau', rarity: 'Kustom', price: 0, cloth: { a: cl1, b: mixHex(cl1, cl2, 0.5), c: cl2 }, cushion: { base: shadeHex(cu, -0.4), mid: shadeHex(cu, -0.2), nose: cu }, rail, sight: g('sight', '#ffffff'), rim: shadeHex(r3, -0.6) };
  },
  _devTablePreview() {
    const D = this.dev, cv = $('dvTablePrev'); if (!cv) return;
    const base = renderTablePreview(this._devTheme(), 900, { cloth: D.clothImg, rail: D.railImg }); cv.width = base.width; cv.height = base.height; cv.getContext('2d').drawImage(base, 0, 0);
  },
  /** Template panduan (PNG) menampilkan zona yang tertutup/terlihat, dengan geometri meja yang sama. */
  _downloadTemplate(kind) {
    const T = CONFIG.table, ct = T.cushion, ext = T.cushion + T.rail, geo = buildTableGeometry(T), off = kind === 'cloth' ? ct : ext;
    const w = T.width + 2 * off, h = T.height + 2 * off, cv = document.createElement('canvas'); cv.width = w; cv.height = h; const c = cv.getContext('2d');
    c.fillStyle = '#3a4152'; c.fillRect(0, 0, w, h);
    c.save(); c.translate(off, off);
    if (kind === 'frame') { c.fillStyle = '#5a6278'; c.fillRect(-ct, -ct, T.width + 2 * ct, T.height + 2 * ct); c.fillStyle = '#fff'; c.font = 'bold 34px sans-serif'; c.textAlign = 'center'; c.fillText('AREA TERTUTUP KAIN — boleh kosong', T.width / 2, T.height / 2); c.font = '26px sans-serif'; c.fillText('Rail kayu terlihat di sekeliling (lebar ' + T.rail + ' px) · gambar 1760×888', T.width / 2, T.height / 2 + 44); }
    else { c.fillStyle = '#fff'; c.font = 'bold 34px sans-serif'; c.textAlign = 'center'; c.fillText('KAIN — di-crop cover ke 1648×776', T.width / 2, T.height / 2); c.font = '26px sans-serif'; c.fillText('Playfield 1600×728 + area cushion ' + ct + ' px di sekeliling', T.width / 2, T.height / 2 + 44); }
    c.strokeStyle = '#57BFEA'; c.lineWidth = 3; c.setLineDash([16, 10]); c.strokeRect(0, 0, T.width, T.height); c.setLineDash([]);
    c.strokeStyle = '#ffb347'; c.lineWidth = 3; for (const P of geo.cushions) { c.beginPath(); c.moveTo(P[0][0], P[0][1]); for (let i = 1; i < 4; i++) c.lineTo(P[i][0], P[i][1]); c.closePath(); c.stroke(); }
    c.strokeStyle = '#ff5a5f'; for (const p of geo.pockets) { c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.stroke(); }
    c.restore(); c.fillStyle = '#ffb347'; c.font = '24px sans-serif'; c.textAlign = 'left'; c.fillText('oranye = cushion · merah = area pocket · biru putus-putus = tepi playfield', 20, h - 16);
    cv.toBlob((b) => downloadBlob(b, 'template-' + kind + '-' + w + 'x' + h + '.png'));
  },
});

/* =====================================================================
   16 · MAIN — bootstrap & game loop
   ===================================================================== */
(function main() {
  const store = new Store(), audio = new AudioManager(store.data.settings), ui = new UI(store, audio);
  const game = new Game({ ui, audio, store });
  const renderer = new Renderer($('stage'), game, store);
  const board = new MockLeaderboard(store);
  ui.attach(game, renderer, board);
  const input = new InputController($('stage'), game, renderer, ui);
  let resizeT = 0;
  window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => renderer.resize(), 80); });
  window.addEventListener('orientationchange', () => setTimeout(() => renderer.resize(), 200));
  window.addEventListener('blur', () => { if (game.isActiveMatch() && !game.paused) game.setPaused(true); });
  window.__pantul = { game, renderer, store, ui };     // untuk debugging/tes
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000); last = now;
    try { input.update(dt); game.update(dt); ui.tick(dt, game); renderer.render(dt); }
    catch (err) { console.error(err); ui.toast('Terjadi kesalahan: ' + err.message, 'foul'); }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();

</script>
