name: Build APK Android
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install pillow
      - run: python3 tools/build.py
      - run: npm test
      - run: npm install
      - run: npx cap add android
      - run: python3 tools/android_patch.py
      - run: npx cap sync android

      # ─────────────────────────────────────────────
      # 1. Pasang debug keystore PERMANEN dari secret
      #    (biar SHA-1 konsisten tiap build)
      # ─────────────────────────────────────────────
      - name: Pasang debug keystore permanen
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret DEBUG_KEYSTORE_BASE64 kosong — pakai keystore default (SHA-1 akan berubah tiap build)"
          else
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > android/app/debug.keystore
            echo "✓ debug.keystore permanen terpasang"
          fi

      # ─────────────────────────────────────────────
      # 2. Inject signingConfig ke app/build.gradle
      # ─────────────────────────────────────────────
      - name: Set signing config di build.gradle
        run: |
          python3 - <<'EOF'
          import pathlib, re
          p = pathlib.Path("android/app/build.gradle")
          s = p.read_text()

          if "signingConfigs" not in s:
              signing_block = '''
          android {
              signingConfigs {
                  debug {
                      storeFile file("debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug {
                      signingConfig signingConfigs.debug
                  }
              }
          '''
              # sisipkan blok signingConfigs ke dalam blok android { yang sudah ada
              idx = s.find("android {")
              insert_at = s.find("{", idx) + 1
              s = s[:insert_at] + signing_block + s[insert_at:]
              p.write_text(s)
              print("✓ signingConfigs ditambahkan")
          else:
              print("• signingConfigs sudah ada, skip")
          EOF

      # ─────────────────────────────────────────────
      # 3. Print SHA-1 / SHA-256 untuk didaftarkan di Firebase
      # ─────────────────────────────────────────────
      - name: Print SHA-1 & SHA-256 keystore
        run: |
          echo "==============================="
          echo " SHA-1 / SHA-256 untuk Firebase"
          echo "==============================="
          keytool -list -v \
            -keystore android/app/debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android 2>/dev/null \
            | grep -E "SHA1:|SHA256:" || \
          keytool -list -v \
            -keystore ~/.android/debug.keystore \
            -alias androiddebugkey \
            -storepass android -keypass android 2>/dev/null \
            | grep -E "SHA1:|SHA256:"
          echo "==============================="
          echo "Copy SHA1 di atas → Firebase Console → Project Settings → Your apps → Add fingerprint"
          echo "==============================="

      # ─────────────────────────────────────────────
      # 4. Tambah google-services.json dari secret
      # ─────────────────────────────────────────────
      - name: Tambah google-services.json (dari secret)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON kosong!"
            exit 1
          fi
          echo "$GS" | base64 -d > android/app/google-services.json
          python3 -c "
          import json
          d = json.load(open('android/app/google-services.json'))
          pkg = d['client'][0]['client_info']['android_client_info']['package_name']
          assert pkg == 'com.pantul.game', f'package_name salah: {pkg}'
          print(f'✓ google-services.json valid, package: {pkg}')
          "

      # ─────────────────────────────────────────────
      # 5. Build APK
      # ─────────────────────────────────────────────
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk pantul.apk

      - uses: actions/upload-artifact@v4
        with:
          name: pantul-apk
          path: pantul.apk

      - name: Lampirkan ke Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pantul.apk
          generate_release_notes: true