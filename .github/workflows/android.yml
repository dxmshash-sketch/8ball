name: Build APK Android
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
        environment: NDROID           # ← tambah ini

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 tools/build.py
      - run: npm test
      - run: npm install
      - run: npx cap add android
      - run: python3 tools/android_patch.py
      - run: npx cap sync android
      - name: Tambah google-services.json (dari secret)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS" ]; then
            echo "::error::Secret GOOGLE_SERVICES_JSON kosong!"
            exit 1
          fi
          echo "$GS" | base64 -d > android/app/google-services.json
          python3 -c "
          import json
          d = json.load(open('android/app/google-services.json'))
          pkg = d['client'][0]['client_info']['android_client_info']['package_name']
          assert pkg == 'com.pantul.game', f'package_name salah: {pkg}'
          print(f'✓ google-services.json valid, package: {pkg}')
          "
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk pantul.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pantul-apk
          path: pantul.apk
      - name: Lampirkan ke Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pantul.apk
          generate_release_notes: true