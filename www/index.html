<script>
'use strict';

/* =====================================================================
   01 · CONFIG & UTIL
   Semua angka "ajaib" ada di sini. Satuan dunia: 1 unit ≈ 1,27 mm
   (meja 9-kaki = 2000 × 1000 unit, bola berdiameter 44 unit).
   ===================================================================== */
const CONFIG = {
  table: {
    // Geometri mengikuti brief: playfield 1600×728 (≈2.2:1), bola Ø30, rail kayu 56 + cushion 24.
    // Catatan: brief menulis outer 1760×800, tetapi 728 + 2×(56+24) = 888. Ubah `rail`/`cushion` di sini bila ingin lain.
    width: 1600, height: 728, rail: 56, cushion: 24, ballRadius: 15,
    cornerMouth: 58, cornerThroat: 44, sideMouth: 52, sideThroat: 34,
    cornerCaptureX: -6, cornerCaptureR: 28, sideCaptureY: -10, sideCaptureR: 20,
    headStringX: 400, footSpotX: 1200,
  },
  physics: {
    fixedStep: 1 / 240, maxStepsPerFrame: 14, maxTravelFraction: 0.4, maxSubsteps: 8,
    slidingAccel: 1200,          // unit/s² saat bola meluncur di kain
    rollingDecel: 72,            // perlambatan konstan saat menggelinding
    rollingDrag: 0.45,           // perlambatan proporsional kecepatan (1/s)
    stopSpeed: 7, slideEpsilon: 2.4,
    sideSpinDecayConst: 30, sideSpinDecayRate: 0.7, sideSpinStopped: 7, sideSpinStop: 0.5,
    ballRestitution: 0.96, ballFriction: 0.05,
    cushionRestitution: 0.9, cushionSpeedLoss: 0.00005, cushionMinRestitution: 0.55,
    cushionFriction: 0.15, cushionSpinKeep: 0.55,
    maxShotSpeed: 4960, maxSpinOffset: 0.5,
    shotTimeoutSeconds: 30,
  },
  rules: {
    turnSeconds: 35, breakSeconds: 45, foulBannerSeconds: 1.7,
    breakMinCushionBalls: 4, matchmakingSeconds: { bot: 0.9, local: 0.4, online: 2.4 },
  },
  aim: { pullMax: 90, cueLengthRatio: 0.75, cueGap: 5, cueAnimSeconds: 0.08, fineRate: 0.32, keyStep: 0.02, keyStepFine: 0.004 },
  bots: {
    easy:   { name: 'Dewi',  level: 2, aimSigma: 0.030, powerSigma: 0.14, think: [1.1, 2.0], pickTop: 3, breakPower: 0.82, reward: 60 },
    medium: { name: 'Rio',   level: 5, aimSigma: 0.012, powerSigma: 0.07, think: [1.3, 2.4], pickTop: 2, breakPower: 0.95, reward: 100 },
    hard:   { name: 'Bima',  level: 9, aimSigma: 0.004, powerSigma: 0.03, think: [1.5, 2.6], pickTop: 1, breakPower: 1.0,  reward: 160 },
  },
  onlineOpponents: ['Ayu_88', 'Kevin.R', 'Nadya', 'Fajar_pool', 'Tasya'],
  colors: {
    balls: [null, '#f2c21c', '#1f56c4', '#d92d2d', '#6a2fa0', '#ee7a1c', '#1f8f4e', '#7a1f2a', '#15131a'],
  },
};

const Util = {
  clamp: (v, lo, hi) => (v < lo ? lo : v > hi ? hi : v),
  lerp: (a, b, t) => a + (b - a) * t,
  wrapAngle(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; },
  lerpAngle(a, b, t) { return a + Util.wrapAngle(b - a) * t; },
  smooth(t) { t = t < 0 ? 0 : t > 1 ? 1 : t; return t * t * (3 - 2 * t); },
  easeOutCubic(t) { t = t < 0 ? 0 : t > 1 ? 1 : t; return 1 - Math.pow(1 - t, 3); },
  hexToRgb(hex) { const n = parseInt(hex.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; },
};

/** PRNG deterministik (mulberry32) — dipakai agar rack identik di semua klien. */
class Rng {
  constructor(seed) { this.s = seed >>> 0; }
  next() {
    this.s = (this.s + 0x6D2B79F5) | 0;
    let t = Math.imul(this.s ^ (this.s >>> 15), 1 | this.s);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  range(a, b) { return a + (b - a) * this.next(); }
  int(n) { return Math.floor(this.next() * n); }
  gauss() { let u = 0, v = 0; while (u === 0) u = this.next(); v = this.next(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
  shuffle(arr) { for (let i = arr.length - 1; i > 0; i--) { const j = this.int(i + 1); const t = arr[i]; arr[i] = arr[j]; arr[j] = t; } return arr; }
}

/* =====================================================================
   02 · CORE — state machine & event bus
   ===================================================================== */
const GameState = Object.freeze({
  MENU: 'MENU', MATCHMAKING: 'MATCHMAKING', BREAK: 'BREAK',
  PLAYER_TURN: 'PLAYER_TURN', OPPONENT_TURN: 'OPPONENT_TURN',
  SHOT_RESOLVING: 'SHOT_RESOLVING', FOUL: 'FOUL', BALL_IN_HAND: 'BALL_IN_HAND',
  GAME_OVER: 'GAME_OVER',
});

const STATE_TRANSITIONS = (() => {
  const S = GameState;
  const turn = [S.SHOT_RESOLVING, S.FOUL, S.MENU];
  return Object.freeze({
    [S.MENU]: [S.MATCHMAKING],
    [S.MATCHMAKING]: [S.BREAK, S.MENU],
    [S.BREAK]: turn,
    [S.PLAYER_TURN]: turn,
    [S.OPPONENT_TURN]: turn,
    [S.SHOT_RESOLVING]: [S.PLAYER_TURN, S.OPPONENT_TURN, S.BREAK, S.FOUL, S.GAME_OVER, S.MENU],
    [S.FOUL]: [S.BALL_IN_HAND, S.MENU],
    [S.BALL_IN_HAND]: [S.PLAYER_TURN, S.OPPONENT_TURN, S.FOUL, S.MENU],
    [S.GAME_OVER]: [S.MATCHMAKING, S.MENU],
  });
})();

class StateMachine {
  constructor(initial, table) { this.state = initial; this.previous = null; this.table = table; this.listeners = []; }
  can(next) { const allowed = this.table[this.state]; return !!allowed && allowed.indexOf(next) !== -1; }
  transition(next) {
    if (!this.can(next)) throw new Error('Transisi state tidak valid: ' + this.state + ' -> ' + next);
    this.previous = this.state; this.state = next;
    for (let i = 0; i < this.listeners.length; i++) this.listeners[i](next, this.previous);
  }
  /** Hanya untuk restore snapshot (reconnect); melewati validasi secara sengaja. */
  restore(state) { this.previous = this.state; this.state = state; for (const fn of this.listeners) fn(state, this.previous); }
  onChange(fn) { this.listeners.push(fn); }
}

class EventBus {
  constructor() { this.map = new Map(); }
  on(evt, fn) { if (!this.map.has(evt)) this.map.set(evt, []); this.map.get(evt).push(fn); return () => this.off(evt, fn); }
  off(evt, fn) { const a = this.map.get(evt); if (!a) return; const i = a.indexOf(fn); if (i >= 0) a.splice(i, 1); }
  emit(evt, payload) { const a = this.map.get(evt); if (!a) return; for (const fn of a.slice()) fn(payload); }
}

/* =====================================================================
   03 · PHYSICS
   Kerangka: x ke kanan, y ke bawah, z masuk ke meja (tangan-kanan).
   Setiap bola menyimpan kecepatan pusat (vx,vy), "roll vector" (rvx,rvy)
   = kecepatan yang seharusnya dimiliki jika menggelinding murni dengan
   spin saat ini, dan side spin wz. Selisih u = v - rv adalah kecepatan
   slip di titik kontak kain: gesekan meluncur menekan u menuju nol
   (fase sliding), lalu bola menggelinding. Top/back spin muncul otomatis
   dari model ini (follow & draw).
   ===================================================================== */
const BallState = Object.freeze({ ON_TABLE: 0, POCKETED: 1 });
const PhysicsEvent = Object.freeze({ BALL: 1, CUSHION: 2, POCKET: 3 });

function rotateOrientation(m, wx, wy, wz, h) {
  const mag = Math.sqrt(wx * wx + wy * wy + wz * wz);
  const ang = mag * h;
  if (ang < 1e-7) return;
  const ax = wx / mag, ay = wy / mag, az = wz / mag;
  const c = Math.cos(ang), s = Math.sin(ang), t = 1 - c;
  const r00 = t * ax * ax + c,      r01 = t * ax * ay - s * az, r02 = t * ax * az + s * ay;
  const r10 = t * ax * ay + s * az, r11 = t * ay * ay + c,      r12 = t * ay * az - s * ax;
  const r20 = t * ax * az - s * ay, r21 = t * ay * az + s * ax, r22 = t * az * az + c;
  for (let j = 0; j < 3; j++) {
    const a = m[j], b = m[3 + j], d = m[6 + j];
    m[j] = r00 * a + r01 * b + r02 * d;
    m[3 + j] = r10 * a + r11 * b + r12 * d;
    m[6 + j] = r20 * a + r21 * b + r22 * d;
  }
}

class Ball {
  constructor(id) {
    this.id = id; this.state = BallState.ON_TABLE;
    this.x = 0; this.y = 0; this.vx = 0; this.vy = 0;
    this.rvx = 0; this.rvy = 0; this.wz = 0;
    this.orient = new Float32Array(9);
    this.dirty = true; this.pocketIndex = -1; this.sinkT = 0; this.fallX = 0; this.fallY = 0;
    this.resetOrientation(null);
  }
  /** Bola objek: nomor menghadap kamera dengan putaran acak. Bola putih: identitas. */
  resetOrientation(rng) {
    const m = this.orient;
    if (this.id === 0 || !rng) { m.set([1, 0, 0, 0, 1, 0, 0, 0, 1]); }
    else {
      m.set([0, 0, 1, 0, 1, 0, -1, 0, 0]);
      rotateOrientation(m, 0, 0, 1, rng.range(0, Math.PI * 2));
      const tilt = rng.range(0, Math.PI * 2);
      rotateOrientation(m, Math.cos(tilt), Math.sin(tilt), 0, rng.range(0, 0.5));
    }
    this.dirty = true;
  }
  isMoving() { return this.vx !== 0 || this.vy !== 0 || this.rvx !== 0 || this.rvy !== 0 || this.wz !== 0; }
  stop() { this.vx = this.vy = this.rvx = this.rvy = this.wz = 0; }
}

class EventQueue {
  constructor(capacity) {
    this.items = [];
    for (let i = 0; i < capacity; i++) this.items.push({ type: 0, a: 0, b: 0, speed: 0, x: 0, y: 0 });
    this.count = 0;
  }
  push(type, a, b, speed, x, y) {
    if (this.count >= this.items.length) return;
    const e = this.items[this.count++];
    e.type = type; e.a = a; e.b = b; e.speed = speed; e.x = x; e.y = y;
  }
  clear() { this.count = 0; }
}


/** Satu sumber kebenaran geometri meja: dipakai untuk collision DAN untuk digambar. */
function buildTableGeometry(T) {
  const W = T.width, H = T.height, ct = T.cushion, S2 = Math.SQRT2;
  const tc = T.cornerMouth / S2, cb = T.cornerThroat / S2 - ct;    // ujung nose & ujung dasar cushion di dekat corner
  const sn = T.sideMouth / 2, sb = T.sideThroat / 2;
  const mx = (p) => [W - p[0], p[1]], my = (p) => [p[0], H - p[1]];
  // urutan titik: nose-awal, nose-akhir, dasar-akhir, dasar-awal  (dasar lebih panjang dari nose → trapezoid)
  const top = [[tc, 0], [W / 2 - sn, 0], [W / 2 - sb, -ct], [cb, -ct]];
  const left = [[0, tc], [0, H - tc], [-ct, H - cb], [-ct, cb]];
  const cushions = [top, top.map(mx), top.map(my), top.map(mx).map(my), left, left.map(mx)];
  const segs = [];
  for (const P of cushions) for (const [a, b] of [[0, 1], [1, 2], [3, 0]]) segs.push(P[a][0], P[a][1], P[b][0], P[b][1]);
  const n = segs.length / 4, segLen2 = new Float64Array(n);
  for (let i = 0; i < n; i++) { const ex = segs[4 * i + 2] - segs[4 * i], ey = segs[4 * i + 3] - segs[4 * i + 1]; segLen2[i] = ex * ex + ey * ey; }
  const cc = T.cornerCaptureX, cr = T.cornerCaptureR, sy = T.sideCaptureY, sr = T.sideCaptureR;
  const shapes = [], pockets = [];
  const corner = (sx, sy_) => {
    const f = (p) => [sx < 0 ? W - p[0] : p[0], sy_ < 0 ? H - p[1] : p[1]];
    shapes.push({ tipA: f([tc, 0]), baseA: f([cb, -ct]), tipB: f([0, tc]), baseB: f([-ct, cb]), axis: [sx < 0 ? 1 : -1, sy_ < 0 ? 1 : -1].map((v) => v / S2), corner: true });
    pockets.push({ x: sx < 0 ? W - cc : cc, y: sy_ < 0 ? H - cc : cc, r: cr, corner: true });
  };
  const side = (down) => {
    const f = (p) => [p[0], down ? H - p[1] : p[1]];
    shapes.push({ tipA: f([W / 2 - sn, 0]), baseA: f([W / 2 - sb, -ct]), tipB: f([W / 2 + sn, 0]), baseB: f([W / 2 + sb, -ct]), axis: [0, down ? 1 : -1], corner: false });
    pockets.push({ x: W / 2, y: down ? H - sy : sy, r: sr, corner: false });
  };
  corner(1, 1); side(false); corner(-1, 1); corner(1, -1); side(true); corner(-1, -1);
  return { W, H, cushions, segs: new Float64Array(segs), segLen2, segCount: n, pockets, pocketShapes: shapes };
}

class PhysicsWorld {
  constructor(config) {
    this.cfg = config;
    const T = config.table;
    this.R = T.ballRadius; this.W = T.width; this.H = T.height;
    this.geo = buildTableGeometry(T);
    this.balls = [];
    for (let i = 0; i < 16; i++) this.balls.push(new Ball(i));
    this.events = new EventQueue(256);
    this.accumulator = 0;
    this.pockets = this.geo.pockets;
  }

  update(frameDt) {
    const P = this.cfg.physics;
    this.accumulator += Math.min(frameDt, 0.05);
    let steps = 0;
    while (this.accumulator >= P.fixedStep && steps < P.maxStepsPerFrame) {
      this._fixedStep(P.fixedStep); this.accumulator -= P.fixedStep; steps++;
    }
    if (this.accumulator > P.fixedStep) this.accumulator = 0;
  }

  allStopped() {
    for (let i = 0; i < 16; i++) { const b = this.balls[i]; if (b.state === BallState.ON_TABLE && b.isMoving()) return false; }
    return true;
  }
  stopAll() { for (let i = 0; i < 16; i++) this.balls[i].stop(); }

  /** Pukulan tongkat: kecepatan awal + spin dari titik kontak pada bola putih. */
  strike(dirX, dirY, power, spinX, spinY) {
    const P = this.cfg.physics, cue = this.balls[0], R = this.R;
    const V = power * P.maxShotSpeed;
    cue.vx = dirX * V; cue.vy = dirY * V;
    const off = P.maxSpinOffset;
    const rv = 2.5 * V * spinY * off;                       // top/back spin (rv sejajar arah tembak)
    cue.rvx = dirX * rv; cue.rvy = dirY * rv;
    const ah = spinX * off * R, rx = -dirY * ah, ry = dirX * ah;   // offset ke kanan arah tembak
    cue.wz = 2.5 * V / (R * R) * (rx * dirY - ry * dirX);
    cue.dirty = true;
  }

  _fixedStep(dt) {
    const P = this.cfg.physics;
    let maxSp2 = 0;
    for (let i = 0; i < 16; i++) {
      const b = this.balls[i];
      if (b.state !== BallState.ON_TABLE) continue;
      const s2 = b.vx * b.vx + b.vy * b.vy;
      if (s2 > maxSp2) maxSp2 = s2;
    }
    const n = Util.clamp(Math.ceil(Math.sqrt(maxSp2) * dt / (this.R * P.maxTravelFraction)), 1, P.maxSubsteps);
    const h = dt / n;
    for (let i = 0; i < n; i++) this._substep(h);
  }

  _substep(h) {
    const balls = this.balls, R = this.R;
    for (let i = 0; i < 16; i++) {
      const b = balls[i];
      if (b.state !== BallState.ON_TABLE || !b.isMoving()) continue;
      this._applyFriction(b, h);
      b.x += b.vx * h; b.y += b.vy * h;
      rotateOrientation(b.orient, b.rvy / R, -b.rvx / R, b.wz, h);
      b.dirty = true;
    }
    for (let i = 0; i < 16; i++) { const b = balls[i]; if (b.state === BallState.ON_TABLE && b.isMoving()) this._collideCushions(b); }
    this._collideBalls();
    for (let i = 0; i < 16; i++) { const b = balls[i]; if (b.state === BallState.ON_TABLE && b.isMoving()) this._collideCushions(b); }
    for (let i = 0; i < 16; i++) { const b = balls[i]; if (b.state === BallState.ON_TABLE && b.isMoving()) this._checkPockets(b); }
  }

  _applyFriction(b, h) {
    const P = this.cfg.physics;
    let remaining = h;
    const dux = b.vx - b.rvx, duy = b.vy - b.rvy;
    const um = Math.sqrt(dux * dux + duy * duy);
    let rolling = um <= P.slideEpsilon;
    if (!rolling) {
      const tFull = um / (3.5 * P.slidingAccel);
      const t = tFull < remaining ? tFull : remaining;
      const ux = dux / um, uy = duy / um;
      b.vx -= P.slidingAccel * ux * t; b.vy -= P.slidingAccel * uy * t;
      b.rvx += 2.5 * P.slidingAccel * ux * t; b.rvy += 2.5 * P.slidingAccel * uy * t;
      remaining -= t;
      if (tFull < h) { rolling = true; b.rvx = b.vx; b.rvy = b.vy; }
    } else { b.rvx = b.vx; b.rvy = b.vy; }

    if (rolling && remaining > 0) {
      const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
      if (sp > 0) {
        const ns = sp - (P.rollingDecel + P.rollingDrag * sp) * remaining;
        if (ns <= P.stopSpeed) { b.vx = b.vy = b.rvx = b.rvy = 0; }
        else { const s = ns / sp; b.vx *= s; b.vy *= s; b.rvx = b.vx; b.rvy = b.vy; }
      } else { b.rvx = b.rvy = 0; }
    }

    if (b.wz !== 0) {
      const stationary = b.vx === 0 && b.vy === 0;
      const rate = stationary ? P.sideSpinStopped : P.sideSpinDecayRate;
      const aw = Math.abs(b.wz), dec = (P.sideSpinDecayConst + rate * aw) * h;
      if (aw <= dec || aw < P.sideSpinStop) b.wz = 0; else b.wz -= Math.sign(b.wz) * dec;
    }
  }

  /** Collision terhadap tepi poligon cushion (nose + rahang miring menuju pocket). */
  _collideCushions(b) {
    const G = this.geo, S = G.segs, L2 = G.segLen2, R = this.R, R2 = R * R;
    for (let i = 0, k = 0; i < G.segCount; i++, k += 4) {
      const ax = S[k], ay = S[k + 1], ex = S[k + 2] - ax, ey = S[k + 3] - ay;
      let t = ((b.x - ax) * ex + (b.y - ay) * ey) / L2[i];
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const dx = b.x - (ax + ex * t), dy = b.y - (ay + ey * t), d2 = dx * dx + dy * dy;
      if (d2 < R2) {
        const d = Math.sqrt(d2) || 0.0001;
        this._bounce(b, dx / d, dy / d, R - d);
      }
    }
  }

  /** Pantulan cushion: restitusi tergantung kecepatan, gesekan tangensial mengubah side spin. */
  _bounce(b, nx, ny, pen) {
    const P = this.cfg.physics, R = this.R;
    b.x += nx * pen; b.y += ny * pen;
    const vn = b.vx * nx + b.vy * ny;
    if (vn >= 0) return;
    const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    const e = Math.max(P.cushionMinRestitution, P.cushionRestitution - P.cushionSpeedLoss * sp);
    const Jn = -(1 + e) * vn;
    b.vx += Jn * nx; b.vy += Jn * ny;
    const tx = -ny, ty = nx;
    const vt = b.vx * tx + b.vy * ty;
    const s = vt - R * b.wz;
    let Jt = -s / 3.5;
    const maxJ = P.cushionFriction * Jn;
    if (Jt > maxJ) Jt = maxJ; else if (Jt < -maxJ) Jt = -maxJ;
    b.vx += Jt * tx; b.vy += Jt * ty;
    b.wz += -2.5 * Jt / R;
    const rvn = b.rvx * nx + b.rvy * ny;
    const d = -P.cushionSpinKeep * rvn - rvn;
    b.rvx += d * nx; b.rvy += d * ny;
    this.events.push(PhysicsEvent.CUSHION, b.id, -1, -vn, b.x, b.y);
  }

  _collideBalls() {
    const P = this.cfg.physics, R = this.R, D = 2 * R, D2 = D * D, balls = this.balls;
    for (let i = 0; i < 16; i++) {
      const a = balls[i];
      if (a.state !== BallState.ON_TABLE) continue;
      for (let j = i + 1; j < 16; j++) {
        const b = balls[j];
        if (b.state !== BallState.ON_TABLE) continue;
        const dx = b.x - a.x, dy = b.y - a.y, d2 = dx * dx + dy * dy;
        if (d2 >= D2) continue;
        if (!a.isMoving() && !b.isMoving()) continue;
        let d = Math.sqrt(d2), nx, ny;
        if (d < 1e-6) { nx = 1; ny = 0; d = 0; } else { nx = dx / d; ny = dy / d; }
        const half = (D - d) * 0.5 + 0.01;
        a.x -= nx * half; a.y -= ny * half; b.x += nx * half; b.y += ny * half;
        const vn = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (vn >= 0) continue;
        const J = -(1 + P.ballRestitution) * vn * 0.5;
        a.vx -= J * nx; a.vy -= J * ny; b.vx += J * nx; b.vy += J * ny;
        const tx = -ny, ty = nx;
        const slip = (b.vx * tx + b.vy * ty - R * b.wz) - (a.vx * tx + a.vy * ty + R * a.wz);
        let Jt = -slip / 7;
        const maxJ = P.ballFriction * J;
        if (Jt > maxJ) Jt = maxJ; else if (Jt < -maxJ) Jt = -maxJ;
        b.vx += Jt * tx; b.vy += Jt * ty; a.vx -= Jt * tx; a.vy -= Jt * ty;
        b.wz += -2.5 * Jt / R; a.wz += -2.5 * Jt / R;
        this.events.push(PhysicsEvent.BALL, a.id, b.id, -vn, (a.x + b.x) * 0.5, (a.y + b.y) * 0.5);
      }
    }
  }

  _checkPockets(b) {
    for (let p = 0; p < 6; p++) {
      const k = this.pockets[p], dx = b.x - k.x, dy = b.y - k.y;
      if (dx * dx + dy * dy < k.r * k.r) { this._pocket(b, p); return; }
    }
    const m = this.R * 4;
    if (b.x < -m || b.x > this.W + m || b.y < -m || b.y > this.H + m) {
      let best = 0, bd = Infinity;
      for (let p = 0; p < 6; p++) { const k = this.pockets[p], d = (b.x - k.x) ** 2 + (b.y - k.y) ** 2; if (d < bd) { bd = d; best = p; } }
      this._pocket(b, best);
    }
  }

  _pocket(b, index) {
    const sp = Math.sqrt(b.vx * b.vx + b.vy * b.vy);
    b.state = BallState.POCKETED; b.pocketIndex = index; b.sinkT = 0;
    b.fallX = b.x; b.fallY = b.y; b.stop();
    this.events.push(PhysicsEvent.POCKET, b.id, index, sp, this.pockets[index].x, this.pockets[index].y);
  }
}

/** Ray-cast untuk garis bidik: bola pertama yang kena atau cushion pertama. */
class AimPredictor {
  static cast(world, ox, oy, dx, dy, ignoreId, out) {
    const R = world.R, D = 2 * R, W = world.W, H = world.H;
    let best = Infinity, hitId = -1;
    for (let i = 1; i < 16; i++) {
      if (i === ignoreId) continue;
      const b = world.balls[i];
      if (b.state !== BallState.ON_TABLE) continue;
      const fx = b.x - ox, fy = b.y - oy, proj = fx * dx + fy * dy;
      if (proj <= 0) continue;
      const perp2 = fx * fx + fy * fy - proj * proj;
      if (perp2 >= D * D) continue;
      const t = proj - Math.sqrt(D * D - perp2);
      if (t < best) { best = t; hitId = i; }
    }
    let tw = Infinity, wnx = 0, wny = 0;
    if (dx > 1e-9) { const t = (W - R - ox) / dx; if (t < tw) { tw = t; wnx = -1; wny = 0; } }
    else if (dx < -1e-9) { const t = (R - ox) / dx; if (t < tw) { tw = t; wnx = 1; wny = 0; } }
    if (dy > 1e-9) { const t = (H - R - oy) / dy; if (t < tw) { tw = t; wnx = 0; wny = -1; } }
    else if (dy < -1e-9) { const t = (R - oy) / dy; if (t < tw) { tw = t; wnx = 0; wny = 1; } }
    if (tw < 0) tw = 0;
    if (hitId >= 0 && best <= tw) {
      const gx = ox + dx * best, gy = oy + dy * best, b = world.balls[hitId];
      let nx = (b.x - gx) / D, ny = (b.y - gy) / D;
      const dot = dx * nx + dy * ny;
      let cx = dx - dot * nx, cy = dy - dot * ny;
      const cl = Math.sqrt(cx * cx + cy * cy);
      if (cl > 1e-6) { cx /= cl; cy /= cl; }
      out.kind = 1; out.t = best; out.hitId = hitId; out.x = gx; out.y = gy;
      out.objX = nx; out.objY = ny; out.cueX = cx; out.cueY = cy; out.cueLen = cl;
    } else {
      out.kind = 2; out.t = tw; out.hitId = -1; out.x = ox + dx * tw; out.y = oy + dy * tw;
      const dot = dx * wnx + dy * wny;
      out.objX = dx - 2 * dot * wnx; out.objY = dy - 2 * dot * wny; out.cueX = 0; out.cueY = 0; out.cueLen = 0;
    }
    return out;
  }
}

/** Matematika jarak tempuh: dipakai bot untuk menentukan power. */
const ShotMath = {
  distanceForSpeed(v, P) { const c0 = P.rollingDecel, c1 = P.rollingDrag; return v / c1 - (c0 / (c1 * c1)) * Math.log(1 + c1 * v / c0); },
  speedForDistance(d, P) {
    let lo = 0, hi = P.maxShotSpeed * 1.3;
    for (let i = 0; i < 32; i++) { const mid = (lo + hi) / 2; if (ShotMath.distanceForSpeed(mid, P) < d) lo = mid; else hi = mid; }
    return (lo + hi) / 2;
  },
};

/* =====================================================================
   04 · RULES — 8-ball (murni logika, tanpa DOM/physics)
   ===================================================================== */
function groupOf(id) { return id === 0 ? null : id === 8 ? 'eight' : id < 8 ? 'solid' : 'stripe'; }

class MatchRules {
  constructor() { this.reset(0); }
  reset(breakerSeat) {
    this.groups = [null, null];
    this.tableOpen = true;
    this.currentSeat = breakerSeat;
    this.isBreak = true;
    this.pocketedIds = new Set();
    this.winner = -1;
  }

  remaining(seat) {
    const g = this.groups[seat]; if (!g) return 7;
    let n = 0;
    for (let id = 1; id <= 15; id++) if (id !== 8 && groupOf(id) === g && !this.pocketedIds.has(id)) n++;
    return n;
  }
  /** Bola yang boleh disentuh pertama kali oleh seat. */
  legalTargets(seat) {
    const out = [];
    if (this.tableOpen || !this.groups[seat]) { for (let id = 1; id <= 15; id++) if (id !== 8 && !this.pocketedIds.has(id)) out.push(id); return out; }
    if (this.remaining(seat) === 0) { if (!this.pocketedIds.has(8)) out.push(8); return out; }
    for (let id = 1; id <= 15; id++) if (id !== 8 && groupOf(id) === this.groups[seat] && !this.pocketedIds.has(id)) out.push(id);
    return out;
  }
  isLegalFirstContact(seat, id) { return this.legalTargets(seat).indexOf(id) !== -1; }

  /**
   * @param rep {firstContact, pocketed:number[], cuePocketed, railAfterContact, cushionBalls}
   * @returns {foul, continueTurn, nextSeat, ballInHand, gameOver, reRack, assigned}
   */
  evaluate(rep) {
    const seat = this.currentSeat, opp = 1 - seat;
    const res = { foul: null, continueTurn: false, nextSeat: opp, ballInHand: 'none', gameOver: null, reRack: false, assigned: null };
    const potted = rep.pocketed, eightPotted = potted.indexOf(8) !== -1;

    if (this.isBreak) {
      if (eightPotted) { res.reRack = true; res.nextSeat = seat; return res; }     // bola 8 masuk saat break: susun ulang, pemecah sama
      let foul = null;
      if (rep.cuePocketed) foul = 'Bola putih masuk saat break';
      else if (rep.firstContact < 0) foul = 'Bola putih tidak mengenai apa pun';
      else if (potted.length === 0 && rep.cushionBalls < CONFIG.rules.breakMinCushionBalls) foul = 'Break tidak sah: kurang dari 4 bola menyentuh cushion';
      for (const id of potted) this.pocketedIds.add(id);
      this.isBreak = false;
      if (foul) { res.foul = foul; res.ballInHand = 'any'; this.currentSeat = opp; return res; }
      res.continueTurn = potted.length > 0; res.nextSeat = res.continueTurn ? seat : opp; this.currentSeat = res.nextSeat;
      return res;
    }

    const cleared = !!this.groups[seat] && this.remaining(seat) === 0;
    let foul = null;
    if (rep.firstContact < 0) foul = 'Bola putih tidak mengenai bola apa pun';
    else if (!this.isLegalFirstContact(seat, rep.firstContact)) {
      foul = rep.firstContact === 8 && !cleared ? 'Menyentuh bola 8 lebih dulu' : 'Bola pertama yang disentuh salah';
    }
    if (rep.cuePocketed) foul = 'Bola putih masuk';
    else if (!foul && potted.length === 0 && !rep.railAfterContact) foul = 'Tidak ada bola yang menyentuh cushion';

    for (const id of potted) this.pocketedIds.add(id);

    if (eightPotted) {
      const legalWin = !foul && cleared;
      res.gameOver = {
        winner: legalWin ? seat : opp,
        reason: legalWin ? 'Bola 8 masuk dengan sah' : (foul ? 'Bola 8 masuk bersamaan dengan foul' : 'Bola 8 masuk sebelum waktunya'),
      };
      this.winner = res.gameOver.winner;
      return res;
    }

    if (!foul && this.tableOpen) {
      const hasSolid = potted.some((id) => groupOf(id) === 'solid'), hasStripe = potted.some((id) => groupOf(id) === 'stripe');
      if (hasSolid !== hasStripe) {
        const g = hasSolid ? 'solid' : 'stripe';
        this.groups[seat] = g; this.groups[opp] = g === 'solid' ? 'stripe' : 'solid';
        this.tableOpen = false; res.assigned = { seat, group: g };
      }
    }

    if (foul) { res.foul = foul; res.ballInHand = 'any'; res.nextSeat = opp; }
    else {
      const mine = this.groups[seat];
      res.continueTurn = mine ? potted.some((id) => groupOf(id) === mine) : potted.length > 0;
      res.nextSeat = res.continueTurn ? seat : opp;
    }
    this.currentSeat = res.nextSeat;
    return res;
  }

  /** Waktu habis: seat yang sedang giliran melakukan foul. */
  forceFoul() { this.isBreak = false; this.currentSeat = 1 - this.currentSeat; return this.currentSeat; }
}

/* =====================================================================
   05 · NET — abstraksi multiplayer
   Semua tembakan (manusia maupun bot) lewat Transport → Validator →
   siaran 'shot'. Untuk online sungguhan cukup ganti MockTransport dengan
   WebSocket client dan jalankan ShotValidator di server (server yang
   otoritatif), UI dan Game tidak perlu berubah.
   ===================================================================== */
class ShotValidator {
  /** view: {matchId, acceptsShots, currentSeat, expectedSeq, cue:{x,y}, ballInHandZone, isPlacementValid(x,y)} */
  static validate(shot, view) {
    if (!shot || typeof shot !== 'object') return 'Data tembakan tidak valid';
    if (shot.matchId !== view.matchId) return 'ID pertandingan tidak cocok';
    if (!view.acceptsShots) return 'Bukan saatnya menembak';
    if (shot.seat !== view.currentSeat) return 'Bukan giliran pemain ini';
    if (shot.seq !== view.expectedSeq) return 'Urutan tembakan tidak sesuai';
    const nums = [shot.angle, shot.power, shot.spinX, shot.spinY];
    for (let i = 0; i < nums.length; i++) if (typeof nums[i] !== 'number' || !isFinite(nums[i])) return 'Nilai tembakan tidak valid';
    if (shot.power < 0.02 || shot.power > 1.0001) return 'Power di luar batas';
    if (shot.spinX * shot.spinX + shot.spinY * shot.spinY > 1.0001) return 'Spin di luar batas';
    if (!shot.cue || !isFinite(shot.cue.x) || !isFinite(shot.cue.y)) return 'Posisi bola putih tidak valid';
    const moved = Math.abs(shot.cue.x - view.cue.x) > 0.5 || Math.abs(shot.cue.y - view.cue.y) > 0.5;
    if (moved && (view.ballInHandZone === 'none' || !view.isPlacementValid(shot.cue.x, shot.cue.y))) return 'Penempatan bola putih tidak sah';
    return null;
  }
}

class MockTransport {
  constructor(opts) {
    this.latency = opts.latency || 0; this.online = !!opts.online;
    this.bus = new EventBus(); this.authority = null;
    this.connected = true; this.roomId = opts.online ? 'R-' + Math.random().toString(36).slice(2, 7).toUpperCase() : 'local';
    this.playerId = 'P-' + Math.random().toString(36).slice(2, 8); this.lastSnapshot = null;
    this.timers = new Set();
  }
  on(evt, fn) { return this.bus.on(evt, fn); }
  _later(fn, ms) {
    if (ms <= 0) { fn(); return; }
    const id = setTimeout(() => { this.timers.delete(id); fn(); }, ms); this.timers.add(id);
  }
  sendShot(shot) {
    if (!this.connected) { this.bus.emit('rejected', { shot, reason: 'Tidak terhubung ke server' }); return; }
    this._later(() => {
      const err = this.authority ? this.authority(shot) : null;
      if (err) this.bus.emit('rejected', { shot, reason: err }); else this.bus.emit('shot', shot);
    }, this.latency);
  }
  publishSnapshot(snap) { this.lastSnapshot = snap; }
  disconnect() { if (!this.connected) return; this.connected = false; this.bus.emit('disconnected'); }
  reconnect() {
    if (this.connected) return;
    this._later(() => { this.connected = true; this.bus.emit('reconnected', { snapshot: this.lastSnapshot }); }, 1100);
  }
  close() { for (const id of this.timers) clearTimeout(id); this.timers.clear(); }
}

/* =====================================================================
   06 · BOT — mencari kombinasi (bola target, kantong) terbaik
   ===================================================================== */
class BotBrain {
  constructor(config, levelKey, rng) {
    this.cfg = config; this.level = config.bots[levelKey]; this.rng = rng;
    this.W = config.table.width; this.H = config.table.height; this.R = config.table.ballRadius;
  }

  planBreak(cue) {
    const a = Math.atan2(this.H / 2 - cue.y, this.cfg.table.footSpotX - cue.x) + this.rng.gauss() * this.level.aimSigma * 0.4;
    return { angle: a, power: this.level.breakPower, spinX: 0, spinY: this.level.aimSigma < 0.01 ? 0.25 : 0 };
  }

  planShot(view) {
    const cue = view.balls[0];
    const cands = this._candidates(view, cue.x, cue.y, view.targets);
    let angle, power;
    if (cands.length) {
      cands.sort((p, q) => q.score - p.score);
      const top = Math.min(this.level.pickTop, cands.length);
      const pick = cands[this.rng.int(top)];
      angle = pick.angle; power = pick.power;
    } else {
      let best = null, bd = Infinity;
      for (const id of view.targets) { const b = view.balls[id]; const d = Math.hypot(b.x - cue.x, b.y - cue.y); if (d < bd) { bd = d; best = b; } }
      if (!best) return { angle: 0, power: 0.4, spinX: 0, spinY: 0 };
      angle = Math.atan2(best.y - cue.y, best.x - cue.x);
      power = Util.clamp(1.4 * ShotMath.speedForDistance(bd + 260, this.cfg.physics) / this.cfg.physics.maxShotSpeed, 0.3, 0.85);
    }
    angle += this.rng.gauss() * this.level.aimSigma;
    power = Util.clamp(power * (1 + this.rng.gauss() * this.level.powerSigma), 0.1, 1);
    return { angle, power, spinX: 0, spinY: 0 };
  }

  choosePlacement(view) {
    const T = this.cfg.table, R = this.R;
    let best = null, bestScore = -Infinity;
    const maxX = view.zone === 'head' ? T.headStringX : this.W - R - 8;
    for (let i = 0; i < 90; i++) {
      const x = this.rng.range(R + 8, maxX), y = this.rng.range(R + 8, this.H - R - 8);
      if (!view.isPlacementValid(x, y)) continue;
      const cands = this._candidates(view, x, y, view.targets);
      let s = -1;
      for (const c of cands) if (c.score > s) s = c.score;
      s += this.rng.range(0, 0.05);
      if (s > bestScore) { bestScore = s; best = { x, y }; }
    }
    return best;
  }

  _candidates(view, cx, cy, targets) {
    const P = this.cfg.physics, R = this.R, W = this.W, H = this.H, out = [];
    for (const id of targets) {
      const t = view.balls[id];
      if (t.state !== BallState.ON_TABLE) continue;
      for (let p = 0; p < 6; p++) {
        const k = view.pockets[p];
        const ax = k.x, ay = k.y;
        const dxp = ax - t.x, dyp = ay - t.y, dTP = Math.hypot(dxp, dyp);
        if (dTP < 1) continue;
        const ux = dxp / dTP, uy = dyp / dTP;
        const gx = t.x - ux * 2 * R, gy = t.y - uy * 2 * R;
        if (gx < R || gx > W - R || gy < R || gy > H - R) continue;
        const cdx = gx - cx, cdy = gy - cy, dCG = Math.hypot(cdx, cdy);
        if (dCG < 2) continue;
        const cos = (cdx / dCG) * ux + (cdy / dCG) * uy;
        if (cos < 0.28) continue;
        if (!this._clear(view, cx, cy, gx, gy, 0, id)) continue;
        if (!this._clear(view, t.x, t.y, ax, ay, id, 0)) continue;
        const vObj = ShotMath.speedForDistance(dTP + 260, P);
        const vImp = vObj / Math.max(0.35, cos * 0.96);
        const v0 = 1.4 * ShotMath.speedForDistance(dCG + ShotMath.distanceForSpeed(vImp, P), P);   // 1,4 = kompensasi fase sliding (v→5/7 v)
        const score = cos - (dCG / 2400) * 0.35 - (dTP / 2400) * 0.5 - (k.corner ? 0 : 0.08);
        out.push({ angle: Math.atan2(cdy, cdx), power: Util.clamp(v0 / P.maxShotSpeed, 0.12, 1), score, targetId: id });
      }
    }
    return out;
  }

  _clear(view, ax, ay, bx, by, ignoreA, ignoreB) {
    const sx = bx - ax, sy = by - ay, len2 = sx * sx + sy * sy, lim = 2 * this.R - 2;
    for (let i = 0; i < 16; i++) {
      if (i === ignoreA || i === ignoreB) continue;
      const b = view.balls[i];
      if (b.state !== BallState.ON_TABLE) continue;
      let t = len2 > 0 ? ((b.x - ax) * sx + (b.y - ay) * sy) / len2 : 0;
      t = t < 0 ? 0 : t > 1 ? 1 : t;
      const px = ax + sx * t - b.x, py = ay + sy * t - b.y;
      if (px * px + py * py < lim * lim) return false;
    }
    return true;
  }
}

/* =====================================================================
   07 · GAME — orkestrator pertandingan (tanpa DOM; UI/audio disuntikkan)
   ===================================================================== */
class ParticlePool {
  constructor(n) {
    this.n = n; this.x = new Float32Array(n); this.y = new Float32Array(n);
    this.vx = new Float32Array(n); this.vy = new Float32Array(n);
    this.life = new Float32Array(n); this.max = new Float32Array(n); this.size = new Float32Array(n);
    this.tone = new Uint8Array(n); this.head = 0;
  }
  burst(x, y, count, tone, speed) {
    for (let i = 0; i < count; i++) {
      const k = this.head; this.head = (this.head + 1) % this.n;
      const a = Math.random() * Math.PI * 2, s = speed * (0.35 + Math.random() * 0.65);
      this.x[k] = x; this.y[k] = y; this.vx[k] = Math.cos(a) * s; this.vy[k] = Math.sin(a) * s;
      this.max[k] = this.life[k] = 0.35 + Math.random() * 0.35; this.size[k] = 2 + Math.random() * 4; this.tone[k] = tone;
    }
  }
  update(dt) {
    const damp = Math.exp(-3 * dt);
    for (let k = 0; k < this.n; k++) {
      if (this.life[k] <= 0) continue;
      this.life[k] -= dt; this.x[k] += this.vx[k] * dt; this.y[k] += this.vy[k] * dt;
      this.vx[k] *= damp; this.vy[k] *= damp;
    }
  }
}

const ACCEPTING = [GameState.BREAK, GameState.PLAYER_TURN, GameState.OPPONENT_TURN];

class Game {
  constructor(services) {
    this.cfg = CONFIG; this.ui = services.ui; this.audio = services.audio; this.store = services.store;
    this.settings = this.store.data.settings;
    this.world = new PhysicsWorld(CONFIG);
    this.rules = new MatchRules();
    this.sm = new StateMachine(GameState.MENU, STATE_TRANSITIONS);
    this.sm.onChange((next, prev) => this.ui.stateChanged(this, next, prev));
    this.particles = new ParticlePool(180);
    this.aim = { angle: 0, power: 0.5, spinX: 0, spinY: 0 };
    this.seats = [{ name: 'Pemain', control: 'local', level: 1 }, { name: 'Lawan', control: 'bot', level: 1 }];
    this.mode = 'bot'; this.difficulty = 'medium'; this.lastOptions = null;
    this.time = 0; this.paused = false; this.shake = 0;
    this.matchId = ''; this.seed = 1; this.rackCount = 0; this.breakerSeat = 0;
    this.expectedSeq = 0; this.shotPending = false; this.pendingShot = null; this.cueAnim = null; this.wasBreak = false;
    this.ballInHandZone = 'none'; this.turnLeft = 0; this.turnTotal = 1;
    this.report = null; this.shotTime = 0; this.foulTimer = 0; this.mmTimer = 0; this.foulInfo = null; this.result = null;
    this.transport = null; this.brain = null; this.botState = { t: 0, plan: null, placed: false };
    this.disconnected = false; this.attract = { t: 0, phase: 'wait' };
    this.cueStats = { force: 5, aim: 5, spin: 5, time: 5 };
    this.bet = 0; this.pottedBySeat = [0, 0];
    this.rng = new Rng((Math.random() * 4294967296) >>> 0);
    this._resetAttract();
  }

  /* ------------------------------ helpers ------------------------------ */
  get state() { return this.sm.state; }
  get currentSeat() { return this.rules.currentSeat; }
  get cue() { return this.world.balls[0]; }
  isTurnState() { return ACCEPTING.indexOf(this.sm.state) !== -1; }
  canControl() { return this.isTurnState() && !this.paused && !this.shotPending && !this.disconnected && this.seats[this.rules.currentSeat].control === 'local'; }
  canPlace() { return !this.paused && !this.disconnected && this.ballInHandZone !== 'none' && (this.sm.state === GameState.BALL_IN_HAND || this.isTurnState()) && !this.shotPending && this.seats[this.rules.currentSeat].control === 'local'; }
  isActiveMatch() { const s = this.sm.state; return s !== GameState.MENU && s !== GameState.MATCHMAKING && s !== GameState.GAME_OVER; }

  isPlacementValid(x, y, zone) {
    zone = zone || this.ballInHandZone;
    const R = this.world.R, W = this.world.W, H = this.world.H;
    if (x < R || x > W - R || y < R || y > H - R) return false;
    if (zone === 'head' && x > this.cfg.table.headStringX) return false;
    for (let i = 1; i < 16; i++) {
      const b = this.world.balls[i];
      if (b.state !== BallState.ON_TABLE) continue;
      if ((b.x - x) ** 2 + (b.y - y) ** 2 < (2 * R + 1) ** 2) return false;
    }
    for (const k of this.world.pockets) if ((k.x - x) ** 2 + (k.y - y) ** 2 < (k.r + 6) ** 2) return false;
    return true;
  }

  _rack(rng) {
    const T = this.cfg.table, R = T.ballRadius, balls = this.world.balls;
    const dx = R * Math.sqrt(3) + 0.35, dy = R + 0.2;
    const slots = [];
    for (let r = 0; r < 5; r++) for (let c = 0; c <= r; c++) slots.push({ x: T.footSpotX + r * dx, y: T.height / 2 + (c - r / 2) * 2 * dy });
    const solids = rng.shuffle([1, 2, 3, 4, 5, 6, 7]), stripes = rng.shuffle([9, 10, 11, 12, 13, 14, 15]);
    const order = new Array(15);
    order[4] = 8; order[10] = solids.pop(); order[14] = stripes.pop();
    const rest = rng.shuffle(solids.concat(stripes));
    for (let i = 0; i < 15; i++) if (order[i] === undefined) order[i] = rest.pop();
    for (let i = 0; i < 15; i++) {
      const b = balls[order[i]];
      b.state = BallState.ON_TABLE; b.stop(); b.x = slots[i].x; b.y = slots[i].y; b.resetOrientation(rng);
    }
    const c = balls[0];
    c.state = BallState.ON_TABLE; c.stop(); c.x = T.headStringX; c.y = T.height / 2; c.resetOrientation(null);
    this.world.events.clear(); this.world.accumulator = 0;
  }

  /* ------------------------------ menu / attract ------------------------------ */
  _resetAttract() {
    this._rack(new Rng((Math.random() * 4294967296) >>> 0));
    this.attract.t = 0; this.attract.phase = 'wait';
  }
  _updateAttract(dt) {
    const a = this.attract, w = this.world; a.t += dt;
    if (a.phase === 'wait') {
      if (a.t > 1.6) {
        const c = w.balls[0], ang = Math.atan2(w.H / 2 - c.y, this.cfg.table.footSpotX - c.x) + (Math.random() - 0.5) * 0.05;
        w.strike(Math.cos(ang), Math.sin(ang), 0.9, (Math.random() - 0.5) * 0.5, Math.random() * 0.5 - 0.1);
        a.phase = 'run'; a.t = 0;
      }
    } else {
      w.update(dt); this._consumeEvents(true);
      if ((w.allStopped() && a.t > 2.5) || a.t > 16) this._resetAttract();
    }
  }

  /* ------------------------------ match lifecycle ------------------------------ */
  /** @returns {boolean} false bila saldo tidak cukup untuk taruhan. */
  startMatch(opts) {
    this._closeTransport();
    const bet = opts.mode === 'local' ? 0 : Math.max(0, opts.bet | 0);
    if (bet > 0 && !this.store.spend(bet)) return false;
    this.bet = bet; this.pottedBySeat = [0, 0];
    this.lastOptions = opts; this.mode = opts.mode; this.difficulty = opts.difficulty || 'medium';
    const profile = this.store.data.profile, bot = this.cfg.bots[this.difficulty];
    const myLevel = 1 + Math.floor(profile.xp / 100);
    this.seed = (Math.random() * 4294967296) >>> 0;
    if (this.mode === 'bot') this.seats = [{ name: profile.name, control: 'local', level: myLevel }, { name: bot.name, control: 'bot', level: bot.level }];
    else if (this.mode === 'local') this.seats = [{ name: 'Pemain 1', control: 'local', level: 1 }, { name: 'Pemain 2', control: 'local', level: 1 }];
    else {
      const names = this.cfg.onlineOpponents;
      this.seats = [{ name: profile.name, control: 'local', level: myLevel }, { name: names[this.seed % names.length], control: 'bot', level: 3 + (this.seed % 6) }];
    }
    this.brain = new BotBrain(this.cfg, this.mode === 'bot' ? this.difficulty : 'medium', new Rng(this.seed ^ 0x9e3779b9));
    this.matchId = 'M-' + this.seed.toString(36);
    this.cueStats = this.mode === 'local' ? { force: 5, aim: 5, spin: 5, time: 5 } : this.store.cueStats();
    this.transport = new MockTransport({ latency: this.mode === 'online' ? 110 : 0, online: this.mode === 'online' });
    this._bindTransport(this.transport);
    this.expectedSeq = 0; this.result = null; this.rackCount = 0; this.paused = false; this.disconnected = false;
    this.shotPending = false; this.cueAnim = null; this.report = null;
    this.sm.transition(GameState.MATCHMAKING);
    this.mmTimer = this.cfg.rules.matchmakingSeconds[this.mode];
    this.ui.showMatchmaking(this);
    return true;
  }

  _bindTransport(t) {
    t.authority = (shot) => ShotValidator.validate(shot, {
      matchId: this.matchId, acceptsShots: this.isTurnState() && !this.cueAnim, currentSeat: this.rules.currentSeat,
      expectedSeq: this.expectedSeq, cue: { x: this.cue.x, y: this.cue.y }, ballInHandZone: this.ballInHandZone,
      isPlacementValid: (x, y) => this.isPlacementValid(x, y),
    });
    t.on('shot', (s) => this._onShotAccepted(s));
    t.on('rejected', (e) => {
      this.shotPending = false;
      if (this.seats[this.rules.currentSeat] && this.seats[this.rules.currentSeat].control === 'bot') { this.botState.plan = null; this.botState.t = 0; }
      this.ui.toast('Tembakan ditolak: ' + e.reason, 'foul');
    });
    t.on('disconnected', () => { this.disconnected = true; this.ui.toast('Koneksi terputus. Menyambung ulang…', 'foul'); this.ui.connectionChanged(this, false); });
    t.on('reconnected', (e) => {
      this.disconnected = false;
      if (e.snapshot) this.restore(e.snapshot);
      this.ui.toast('Tersambung kembali', 'ok'); this.ui.connectionChanged(this, true);
    });
  }
  _closeTransport() { if (this.transport) { this.transport.close(); this.transport = null; } }

  _finishMatchmaking() {
    this.breakerSeat = this.result || this.rackCount > 0 ? 1 - this.breakerSeat : this.seed & 1;
    this._beginRack(this.breakerSeat);
    this.sm.transition(GameState.BREAK);
    this._afterTurnStart(true);
    this.turnTotal = this.turnLeft = this.cfg.rules.breakSeconds;
  }
  _beginRack(seat) {
    this.rackCount++;
    this.rules.reset(seat);
    this._rack(new Rng(this.seed + this.rackCount * 7919));
    this.ballInHandZone = 'head';
  }
  _afterTurnStart(isBreak) {
    this.botState = { t: 0, plan: null, placed: false };
    this.shotPending = false; this.aim.spinX = 0; this.aim.spinY = 0; this.aim.power = 0.5;
    this.aim.angle = isBreak ? 0 : this._angleToNearestTarget();
    this.turnTotal = this.turnLeft = this._turnSeconds();
    this.ui.refreshPlayers(this); this._publishSnapshot();
  }
  _turnSeconds() { return this.cfg.rules.turnSeconds + (this.rules.currentSeat === 0 ? this.cueStats.time * 1.5 : 0); }
  _angleToNearestTarget() {
    const cue = this.cue, targets = this.rules.legalTargets(this.rules.currentSeat);
    let best = null, bd = Infinity;
    for (const id of targets) { const b = this.world.balls[id]; if (b.state !== BallState.ON_TABLE) continue; const d = (b.x - cue.x) ** 2 + (b.y - cue.y) ** 2; if (d < bd) { bd = d; best = b; } }
    return best ? Math.atan2(best.y - cue.y, best.x - cue.x) : 0;
  }
  _beginTurn(seat) {
    this.rules.currentSeat = seat;
    this.sm.transition(seat === 0 ? GameState.PLAYER_TURN : GameState.OPPONENT_TURN);
    this._afterTurnStart(false);
  }

  /* ------------------------------ per-frame ------------------------------ */
  update(dt) {
    this.time += dt;
    this.particles.update(dt);
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 2.4);
    for (let i = 0; i < 16; i++) { const b = this.world.balls[i]; if (b.state === BallState.POCKETED && b.sinkT < 1) b.sinkT += dt / 0.12; }
    if (this.paused) return;
    switch (this.sm.state) {
      case GameState.MENU: this._updateAttract(dt); break;
      case GameState.MATCHMAKING: this.mmTimer -= dt; if (this.mmTimer <= 0) this._finishMatchmaking(); break;
      case GameState.BREAK: case GameState.PLAYER_TURN: case GameState.OPPONENT_TURN: case GameState.BALL_IN_HAND: this._updateTurn(dt); break;
      case GameState.SHOT_RESOLVING: this._updateResolving(dt); break;
      case GameState.FOUL: this.foulTimer -= dt; if (this.foulTimer <= 0) this._afterFoul(); break;
      default: break;
    }
  }

  _updateTurn(dt) {
    if (!this.shotPending && !this.disconnected) {
      this.turnLeft -= dt;
      if (this.turnLeft <= 0) { this._timeout(); return; }
    }
    this._updateBot(dt);
  }

  _timeout() {
    const loser = this.seats[this.rules.currentSeat].name;
    const next = this.rules.forceFoul();
    this.shotPending = false;
    this._foul('Waktu habis untuk ' + loser, next);
  }

  _updateResolving(dt) {
    if (this.cueAnim) {
      this.cueAnim.t += dt;
      if (this.cueAnim.t >= this.cueAnim.dur) { this.cueAnim = null; this._strike(); }
      return;
    }
    this.world.update(dt); this._consumeEvents(false); this.shotTime += dt;
    if (this.world.allStopped() || this.shotTime > this.cfg.physics.shotTimeoutSeconds) {
      if (!this.world.allStopped()) this.world.stopAll();
      this._finishShot();
    }
  }

  _consumeEvents(silent) {
    const ev = this.world.events, rep = silent ? null : this.report;
    for (let i = 0; i < ev.count; i++) {
      const e = ev.items[i];
      if (e.type === PhysicsEvent.BALL) {
        if (!silent) this.audio.play('ball', Math.min(1, e.speed / 3200));
        if (rep && rep.firstContact < 0 && (e.a === 0 || e.b === 0)) rep.firstContact = e.a === 0 ? e.b : e.a;
      } else if (e.type === PhysicsEvent.CUSHION) {
        if (!silent) this.audio.play('cushion', Math.min(1, e.speed / 2600));
        if (rep) {
          if (rep.firstContact >= 0) rep.railAfterContact = true;
          if (e.a > 0 && !rep.cushionSeen[e.a]) { rep.cushionSeen[e.a] = 1; rep.cushionBalls++; }
        }
      } else if (e.type === PhysicsEvent.POCKET) {
        if (!silent) this.audio.play('pocket', Math.min(1, e.speed / 2000));
        this.particles.burst(e.x, e.y, 14, e.a === 0 ? 1 : 0, 260);
        if (rep) { if (e.a === 0) rep.cuePocketed = true; else rep.pocketed.push(e.a); }
      }
    }
    ev.clear();
  }

  /* ------------------------------ shot flow ------------------------------ */
  _submitShot(seatIdx) {
    if (this.shotPending || !this.transport) return false;
    const cue = this.cue;
    this.shotPending = true;
    this.transport.sendShot({
      matchId: this.matchId, seat: seatIdx, seq: this.expectedSeq,
      angle: this.aim.angle, power: this.aim.power, spinX: this.aim.spinX, spinY: this.aim.spinY,
      cue: { x: cue.x, y: cue.y },
    });
    return true;
  }

  _onShotAccepted(shot) {
    if (!this.isTurnState()) return;
    this.shotPending = false; this.pendingShot = shot; this.expectedSeq++;
    this.cue.x = shot.cue.x; this.cue.y = shot.cue.y; this.cue.state = BallState.ON_TABLE;
    this.aim.angle = shot.angle; this.aim.power = shot.power; this.aim.spinX = shot.spinX; this.aim.spinY = shot.spinY;
    this.wasBreak = this.rules.isBreak; this.ballInHandZone = 'none';
    this.cueAnim = { t: 0, dur: this.cfg.aim.cueAnimSeconds };
    this.sm.transition(GameState.SHOT_RESOLVING);
  }

  _strike() {
    const s = this.pendingShot;
    this.report = { seat: s.seat, isBreak: this.wasBreak, firstContact: -1, pocketed: [], cuePocketed: false, railAfterContact: false, cushionBalls: 0, cushionSeen: new Uint8Array(16) };
    const st = this.cueStats, mine = s.seat === 0;      // perk cue hanya untuk seat 0 (bukan mode dua pemain)
    const fm = mine ? 0.92 + st.force * 0.016 : 1, sm = mine ? 0.8 + st.spin * 0.04 : 1;
    this.world.strike(Math.cos(s.angle), Math.sin(s.angle), s.power * fm, s.spinX * sm, s.spinY * sm);
    this.shotTime = 0;
    this.audio.play('cue', s.power);
    if (this.wasBreak) { this.audio.play('break'); this.shake = 1; }
  }

  _finishShot() {
    const rep = this.report; this.report = null;
    const res = this.rules.evaluate(rep);
    if (res.reRack) {
      this._beginRack(res.nextSeat);
      this.ui.toast('Bola 8 masuk saat break — bola disusun ulang', 'info');
      this.sm.transition(GameState.BREAK); this._afterTurnStart(true);
      this.turnTotal = this.turnLeft = this.cfg.rules.breakSeconds;
      return;
    }
    for (const id of rep.pocketed) this.pottedBySeat[rep.seat]++;
    if (rep.cuePocketed) this._respotCue();
    if (res.assigned) {
      const who = this.seats[res.assigned.seat].name, g = res.assigned.group === 'solid' ? 'bola penuh (1–7)' : 'bola strip (9–15)';
      this.ui.toast(who + ' memegang ' + g, 'info');
    }
    if (res.gameOver) { this._endMatch(res.gameOver.winner, res.gameOver.reason); return; }
    if (res.foul) { this._foul(res.foul, res.nextSeat); return; }
    if (res.continueTurn) this.ui.toast('Lanjut menembak', 'ok');
    this._beginTurn(res.nextSeat);
  }

  _respotCue() {
    const T = this.cfg.table, cue = this.cue;
    cue.state = BallState.ON_TABLE; cue.stop(); cue.resetOrientation(null);
    let best = null;
    for (let r = 0; r < 900 && !best; r += 28) {
      const steps = r === 0 ? 1 : Math.ceil(r / 14);
      for (let i = 0; i < steps; i++) {
        const a = (i / steps) * Math.PI * 2, x = T.headStringX + Math.cos(a) * r, y = T.height / 2 + Math.sin(a) * r;
        if (this.isPlacementValid(x, y, 'any')) { best = { x, y }; break; }
      }
    }
    cue.x = best ? best.x : T.headStringX; cue.y = best ? best.y : T.height / 2;
  }

  _foul(reason, nextSeat) {
    this.foulInfo = { reason, seat: nextSeat };
    this.ballInHandZone = 'any'; this.foulTimer = this.cfg.rules.foulBannerSeconds;
    this.cueAnim = null; this.shotPending = false;
    this.sm.transition(GameState.FOUL);
    this.ui.toast('Foul — ' + reason, 'foul'); this.audio.play('foul');
    this.ui.refreshPlayers(this);
  }
  _afterFoul() {
    this.sm.transition(GameState.BALL_IN_HAND);
    this.botState = { t: 0, plan: null, placed: false };
    this.turnTotal = this.turnLeft = this._turnSeconds();
    this.aim.angle = this._angleToNearestTarget();
    this.ui.refreshPlayers(this); this._publishSnapshot();
  }

  _endMatch(winner, reason) {
    const youWon = winner === 0;
    this.result = { winner, reason, youWon, bet: this.bet, mode: this.mode, winnerName: this.seats[winner].name, potted: this.pottedBySeat[0], summary: null };
    if (this.mode !== 'local') this.result.summary = this.store.recordMatch(this.result);
    this.sm.transition(GameState.GAME_OVER);
    this.audio.play(this.mode === 'local' || youWon ? 'win' : 'lose');
    this.ui.showResult(this);
  }
  /** Keluar di tengah pertandingan bertaruh = kalah (taruhan hangus). */
  forfeit() {
    if (this.sm.state === GameState.MATCHMAKING && this.bet > 0) { this.store.addCoins(this.bet); this.bet = 0; return null; }   // batal sebelum main: taruhan kembali
    if (!this.isActiveMatch() || this.mode === 'local' || this.bet <= 0) return null;
    return this.store.recordMatch({ youWon: false, bet: this.bet, potted: this.pottedBySeat[0], mode: this.mode });
  }

  /* ------------------------------ bot ------------------------------ */
  _botView() {
    return { balls: this.world.balls, pockets: this.world.pockets, targets: this.rules.legalTargets(this.rules.currentSeat), zone: this.ballInHandZone, isPlacementValid: (x, y) => this.isPlacementValid(x, y) };
  }
  _updateBot(dt) {
    const idx = this.rules.currentSeat, seat = this.seats[idx];
    if (!seat || seat.control !== 'bot' || this.shotPending || this.disconnected) return;
    const b = this.botState; b.t += dt;
    if (this.sm.state === GameState.BALL_IN_HAND) {
      if (!b.placed && b.t > 0.8) {
        const p = this.brain.choosePlacement(this._botView());
        if (p) this._setCue(p.x, p.y);
        b.placed = true; b.t = 0;
      } else if (b.placed && b.t > 0.55) this.confirmPlacement();
      return;
    }
    if (!b.plan) {
      b.plan = this.rules.isBreak ? this.brain.planBreak(this.cue) : this.brain.planShot(this._botView());
      const th = this.cfg.bots[this.mode === 'bot' ? this.difficulty : 'medium'].think;
      b.think = th[0] + this.rng.next() * (th[1] - th[0]); b.t = 0; b.startAngle = this.aim.angle;
    }
    const a = this.aim, p = b.plan;
    a.angle = Util.lerpAngle(b.startAngle, p.angle, Util.easeOutCubic(b.t / (b.think * 0.7)));
    const pk = Util.smooth((b.t - b.think * 0.5) / (b.think * 0.5));
    a.power = 0.05 + (p.power - 0.05) * pk; a.spinX = p.spinX * pk; a.spinY = p.spinY * pk;
    if (b.t >= b.think) { a.angle = p.angle; a.power = p.power; a.spinX = p.spinX; a.spinY = p.spinY; this._submitShot(idx); }
  }

  /* ------------------------------ input API (pemain lokal) ------------------------------ */
  setAimAngle(a) { if (this.canControl()) this.aim.angle = Util.wrapAngle(a); }
  nudgeAim(d) { if (this.canControl()) this.aim.angle = Util.wrapAngle(this.aim.angle + d); }
  setPower(p) { if (this.canControl()) this.aim.power = Util.clamp(p, 0, 1); }
  setSpin(x, y) {
    if (!this.canControl()) return;
    const l = Math.sqrt(x * x + y * y), k = l > 1 ? 1 / l : 1;
    this.aim.spinX = x * k; this.aim.spinY = y * k;
  }
  requestShot() {
    if (!this.canControl() || this.aim.power < 0.03) return false;
    return this._submitShot(this.rules.currentSeat);
  }
  _setCue(x, y) { this.cue.x = x; this.cue.y = y; this.cue.stop(); this.cue.dirty = true; }
  /** Geser bola putih (ball-in-hand / break). Mengembalikan true jika posisi diterima. */
  moveCue(x, y) {
    if (!this.canPlace()) return false;
    const T = this.cfg.table, R = T.ballRadius;
    const maxX = this.ballInHandZone === 'head' ? T.headStringX : T.width - R;
    x = Util.clamp(x, R, maxX); y = Util.clamp(y, R, T.height - R);
    if (this.isPlacementValid(x, y)) { this._setCue(x, y); return true; }
    if (this.isPlacementValid(x, this.cue.y)) { this._setCue(x, this.cue.y); return true; }
    if (this.isPlacementValid(this.cue.x, y)) { this._setCue(this.cue.x, y); return true; }
    return false;
  }
  confirmPlacement() {
    if (this.sm.state !== GameState.BALL_IN_HAND) return false;
    const seat = this.rules.currentSeat;
    this.sm.transition(seat === 0 ? GameState.PLAYER_TURN : GameState.OPPONENT_TURN);
    this.botState = { t: 0, plan: null, placed: false };
    this.ui.refreshPlayers(this);
    return true;
  }

  /* ------------------------------ pause / navigasi ------------------------------ */
  setPaused(p) { if (p && !this.isActiveMatch()) return; this.paused = p; this.ui.pausedChanged(this, p); }
  quitToMenu() {
    const forfeited = this.forfeit();
    this._closeTransport(); this.paused = false; this.disconnected = false; this.cueAnim = null; this.shotPending = false;
    if (this.sm.state !== GameState.MENU) this.sm.transition(GameState.MENU);
    this._resetAttract(); this.ui.pausedChanged(this, false);
    return forfeited;
  }
  restartMatch() { const o = this.lastOptions; this.quitToMenu(); return o ? this.startMatch(o) : false; }
  rematch() { return this.lastOptions && this.sm.state === GameState.GAME_OVER ? this.startMatch(this.lastOptions) : false; }
  simulateDisconnect() { if (this.transport && this.mode === 'online' && this.isTurnState()) { this.transport.disconnect(); this.transport.reconnect(); return true; } return false; }

  /* ------------------------------ snapshot (reconnect) ------------------------------ */
  serialize() {
    const r = this.rules;
    return {
      matchId: this.matchId, state: this.sm.state, expectedSeq: this.expectedSeq, zone: this.ballInHandZone, rackCount: this.rackCount,
      balls: this.world.balls.map((b) => ({ id: b.id, state: b.state, x: b.x, y: b.y })),
      rules: { groups: r.groups.slice(), tableOpen: r.tableOpen, currentSeat: r.currentSeat, isBreak: r.isBreak, pocketed: Array.from(r.pocketedIds) },
    };
  }
  _publishSnapshot() { if (this.transport) this.transport.publishSnapshot(this.serialize()); }
  restore(s) {
    if (!s || s.matchId !== this.matchId) return;
    for (const d of s.balls) { const b = this.world.balls[d.id]; b.state = d.state; b.x = d.x; b.y = d.y; b.stop(); b.dirty = true; }
    const r = this.rules; r.groups = s.rules.groups.slice(); r.tableOpen = s.rules.tableOpen; r.currentSeat = s.rules.currentSeat; r.isBreak = s.rules.isBreak; r.pocketedIds = new Set(s.rules.pocketed);
    this.expectedSeq = s.expectedSeq; this.ballInHandZone = s.zone; this.shotPending = false; this.cueAnim = null;
    if (this.sm.state !== s.state) this.sm.restore(s.state);
    this.ui.refreshPlayers(this);
  }

  /* ------------------------------ untuk renderer ------------------------------ */
  cuePullDistance() {
    const pm = this.cfg.aim.pullMax;
    if (this.cueAnim && this.pendingShot) { const k = Math.min(1, this.cueAnim.t / this.cueAnim.dur); return this.pendingShot.power * pm * (1 - k * k); }
    return this.aim.power * pm;
  }
  cueVisible() {
    const s = this.sm.state;
    if (s === GameState.SHOT_RESOLVING) return !!this.cueAnim;
    return this.isTurnState() && this.cue.state === BallState.ON_TABLE;
  }
  aimLineVisible() { return this.canControl(); }
  aimGuideLength() { return 260 + this.cueStats.aim * 60; }
}

/* =====================================================================
   08 · AUDIO — abstraksi suara. Setiap nama efek punya sintesis bawaan
   (WebAudio, tanpa file) yang bisa diganti sample lewat setSample(name, url).
   ===================================================================== */
class AudioManager {
  constructor(settings) {
    this.settings = settings; this.ctx = null; this.master = null; this.sfxBus = null; this.musicBus = null;
    this.samples = new Map(); this.noise = null; this.frameCount = 0; this.lastFrame = -1; this.musicTimer = null; this.musicStep = 0;
    this.synth = {
      ball: (v) => { this._noiseBurst(0.028, 2600, 0.5 * v + 0.08, 'highpass'); this._tone(1700 + v * 900, 0.05, 'sine', 0.22 * v + 0.05, 0.7); },
      cushion: (v) => { this._noiseBurst(0.11, 420, 0.4 * v + 0.08, 'lowpass'); this._tone(150, 0.09, 'sine', 0.3 * v + 0.05, 0.6); },
      cue: (v) => { this._noiseBurst(0.02, 3200, 0.35, 'highpass'); this._tone(190, 0.07, 'triangle', 0.4 * v + 0.1, 0.5); },
      pocket: (v) => { this._tone(260, 0.24, 'sine', 0.3, 0.35); this._noiseBurst(0.35, 300, 0.25, 'lowpass'); },
      break: () => { this._noiseBurst(0.08, 3800, 0.9, 'highpass'); this._tone(90, 0.25, 'sine', 0.6, 0.5); this._noiseBurst(0.4, 500, 0.3, 'lowpass'); },
      ui: () => this._tone(760, 0.06, 'square', 0.07, 1.25),
      foul: () => { this._tone(220, 0.22, 'sawtooth', 0.12, 0.7); },
      win: () => [523, 659, 784, 1046].forEach((f, i) => this._tone(f, 0.28, 'triangle', 0.2, 1, i * 0.11)),
      lose: () => [392, 330, 262, 196].forEach((f, i) => this._tone(f, 0.32, 'triangle', 0.18, 1, i * 0.14)),
    };
  }
  unlock() {
    if (!this.ctx) {
      const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
      this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.connect(this.ctx.destination);
      this.sfxBus = this.ctx.createGain(); this.sfxBus.connect(this.master);
      this.musicBus = this.ctx.createGain(); this.musicBus.gain.value = 0.5; this.musicBus.connect(this.master);
      const n = this.ctx.sampleRate; this.noise = this.ctx.createBuffer(1, n, n);
      const d = this.noise.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
    this.applySettings();
  }
  applySettings() { if (!this.ctx) return; this.sfxBus.gain.value = this.settings.sfx ? 1 : 0; if (this.settings.music) this._startMusic(); else this._stopMusic(); }
  setSample(name, url) {
    if (!this.ctx) return Promise.resolve();
    return fetch(url).then((r) => r.arrayBuffer()).then((b) => this.ctx.decodeAudioData(b)).then((buf) => this.samples.set(name, buf));
  }
  play(name, intensity) {
    if (!this.ctx || !this.settings.sfx) return;
    const v = intensity === undefined ? 0.6 : Math.max(0, Math.min(1, intensity));
    const now = this.ctx.currentTime;
    if (now !== this.lastFrame) { this.lastFrame = now; this.frameCount = 0; }
    if (++this.frameCount > 6) return;                  // batasi suara serentak
    const buf = this.samples.get(name);
    if (buf) { const s = this.ctx.createBufferSource(), g = this.ctx.createGain(); s.buffer = buf; g.gain.value = 0.3 + 0.7 * v; s.connect(g); g.connect(this.sfxBus); s.start(); return; }
    const fn = this.synth[name]; if (fn) fn(v);
  }
  _tone(freq, dur, type, gain, endRatio, delay) {
    const c = this.ctx, t = c.currentTime + (delay || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, freq * (endRatio || 1)), t + dur);
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.sfxBus); o.start(t); o.stop(t + dur + 0.02);
  }
  _noiseBurst(dur, freq, gain, filterType) {
    const c = this.ctx, t = c.currentTime, s = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    s.buffer = this.noise; f.type = filterType; f.frequency.value = freq;
    g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f); f.connect(g); g.connect(this.sfxBus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
  }
  _startMusic() {
    if (this.musicTimer || !this.ctx) return;
    const chords = [[220, 277, 330], [196, 247, 294], [175, 220, 262], [196, 247, 294]];
    const play = () => {
      const c = this.ctx, t = c.currentTime, ch = chords[this.musicStep++ % chords.length];
      for (const f of ch) {
        const o = c.createOscillator(), g = c.createGain(), lp = c.createBiquadFilter();
        o.type = 'triangle'; o.frequency.value = f / 2; lp.type = 'lowpass'; lp.frequency.value = 700;
        g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(0.05, t + 1.2); g.gain.linearRampToValueAtTime(0.0001, t + 3.9);
        o.connect(lp); lp.connect(g); g.connect(this.musicBus); o.start(t); o.stop(t + 4);
      }
    };
    play(); this.musicTimer = setInterval(play, 3600);
  }

const fmtCoins = (n) => Math.round(n).toLocaleString('id-ID');
const fmtShort = (n) => {
  const t = (x) => String(parseFloat(x.toFixed(1)));
  return n >= 1e9 ? t(n / 1e9) + 'B' : n >= 1e6 ? t(n / 1e6) + 'M' : n >= 1e3 ? t(n / 1e3) + 'K' : String(Math.round(n));
};

/* ---------------- level & XP ---------------- */
const xpForLevel = (l) => 100 + (l - 1) * 50;                  // XP untuk naik dari level l ke l+1
function levelInfo(xp) {
  let l = 1, rem = xp;
  while (l < MAX_LEVEL && rem >= xpForLevel(l)) { rem -= xpForLevel(l); l++; }
  const need = l >= MAX_LEVEL ? 1 : xpForLevel(l);
  return { level: l, into: l >= MAX_LEVEL ? 1 : rem, need, pct: l >= MAX_LEVEL ? 1 : rem / need };
}

const CUE_REWARDS = ['kristal', 'samudra', 'rimba', 'sakura', 'jade', 'kobaran', 'petir', 'batik'];
