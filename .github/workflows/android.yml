name: Build APK Android
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - run: python3 tools/build.py
      - run: npm test
      - run: npm install
      - run: npx cap add android
      - run: python3 tools/android_patch.py
      - run: npx cap sync android
      - name: Build APK (debug, sudah bertanda tangan debug sehingga bisa di-install)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Ganti nama APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk pantul.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pantul-apk
          path: pantul.apk
      - name: Lampirkan ke Release (hanya saat push tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: pantul.apk
          generate_release_notes: true
