<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pantul — Billiard 8-Ball</title>
<meta name="theme-color" content="#222831">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Semi+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#222831; --panel:#31363F; --panel-2:#2a2f38; --cloth:#57BFEA; --gold:#F4C542; --ok:#32D74B; --bad:#FF5A5F; --text:#fff; --muted:#a9b1bd;
  --cue-bg:#1A1B25; --cue-prev:#1D1E28; --cue-panel:#32003E; --cue-line:#6A0D83; --cue-gold:#F7C948; --cue-green:#39FF14; --cue-dim:#2a0b36; --cue-sec:#C9B8D9;
  --hud-h:62px;
  --f-head:'Barlow Semi Condensed','Arial Narrow',system-ui,sans-serif; --f-body:'Barlow',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
canvas#stage{position:fixed;inset:0;display:block;touch-action:none}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;transition:transform .09s ease-out,filter .12s}
button:active:not(:disabled){transform:scale(.96)}
button:disabled{cursor:default;opacity:.5}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
[hidden]{display:none!important}
input,select,textarea{font:inherit;color:#fff;-webkit-user-select:text;user-select:text}

/* ---------- tombol ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 24px;border-radius:12px;font-family:var(--f-head);font-weight:700;font-size:20px;background:#3d4451;color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 2px 0 rgba(0,0,0,.35)}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn.primary{background:linear-gradient(#ffd66b,#F4C542);color:#3b2a00;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 2px 0 #a27a10}
.btn.green{background:linear-gradient(#4be566,#28b83f);color:#04250b;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 0 #167a29}
.btn.danger{background:#5b2a2d;color:#ffd7d8}
.btn.small{min-height:38px;padding:0 16px;font-size:17px}
.btn.big{min-height:56px;font-size:26px;width:100%}
.coin{display:inline-block;vertical-align:-4px;width:1.05em;height:1.05em}

/* ---------- layar (slide horizontal) ---------- */
#screens{position:fixed;inset:0;pointer-events:none;z-index:20}
.screen{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:none;visibility:hidden;opacity:0;transform:translateX(56px);transition:transform .32s cubic-bezier(.2,.8,.2,1),opacity .24s,visibility 0s .32s}
.screen.active{pointer-events:auto;visibility:visible;opacity:1;transform:none;transition-delay:0s}
.screen.left{transform:translateX(-56px)}
.scrim{background:radial-gradient(ellipse at 50% 45%,rgba(20,24,30,.55),rgba(14,17,22,.9))}
.panel{background:var(--panel);border:1px solid rgba(255,255,255,.07);border-radius:20px;box-shadow:0 18px 50px rgba(0,0,0,.45);padding:22px;max-height:100%;overflow-y:auto}
.panel h2{margin:0 0 6px;font-family:var(--f-head);font-size:32px;font-weight:700}
.panel p.sub,.sub{margin:0 0 16px;color:var(--muted);line-height:1.4}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.narrow{width:min(460px,100%)}
.stack{display:flex;flex-direction:column;gap:10px;margin-top:8px}.stack .btn{width:100%}
.pagescreen{background:var(--bg);align-items:stretch;padding:0}
.pg{width:min(1100px,100%);height:100%;display:flex;flex-direction:column}
.pg-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.07);flex:none}
.pg-head h2{margin:0;font-family:var(--f-head);font-size:28px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pg-body{overflow-y:auto;padding:16px;flex:1;-webkit-overflow-scrolling:touch}
.chip{display:flex;align-items:center;gap:8px;min-height:40px;padding:4px 14px 4px 5px;border-radius:22px;background:rgba(49,54,63,.92);border:1px solid rgba(255,255,255,.07);font-weight:600;text-align:left}
.chip.coins{padding-left:10px;color:var(--gold);font-family:var(--f-head);font-size:19px}
.chip-name{display:flex;flex-direction:column;line-height:1.1}.chip-name small{color:var(--gold);font-size:12px}
.seg{display:inline-flex;background:var(--panel-2);border-radius:12px;padding:4px;gap:4px;flex-wrap:wrap}
.seg button{padding:8px 16px;border-radius:9px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--gold);color:#3b2a00}
.muted{color:var(--muted)} .gold{color:var(--gold)} .ok{color:var(--ok)} .bad{color:var(--bad)}
.note{font-size:13px;color:var(--muted);margin:10px 0 0;line-height:1.4}

/* ---------- menu utama ---------- */
#screenMenu{justify-content:flex-start;align-items:stretch;padding:0}
.menu-wrap{display:flex;flex-direction:column;justify-content:space-between;width:min(520px,100%);padding:18px 26px 22px;background:linear-gradient(90deg,rgba(18,21,27,.94),rgba(18,21,27,.72) 72%,transparent);overflow-y:auto}
.chips{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.logo{margin:0;font-family:var(--f-head);font-weight:700;font-size:clamp(56px,10vw,112px);line-height:.9;letter-spacing:-2px}
.tag{margin:10px 0 20px;color:var(--muted);font-size:17px;max-width:30ch;line-height:1.35}
.menu-actions{display:flex;flex-direction:column;gap:12px;align-items:stretch;max-width:360px}
.menu-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:14px;background:rgba(49,54,63,.92);border:1px solid rgba(255,255,255,.07);font-family:var(--f-head);font-weight:600;font-size:16px}
.tile:hover{filter:brightness(1.15)}
.ico{width:28px;height:28px;color:var(--gold)}.ico svg{width:100%;height:100%}
.dot{position:absolute;top:8px;right:12px;width:11px;height:11px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 3px rgba(255,90,95,.3);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,90,95,0)}}
.foot{color:#7d8794;font-size:13px}

/* ---------- pilih mode & taruhan ---------- */
.modes{width:min(920px,100%)}
.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:14px}
.mode-card{text-align:left;padding:14px;border-radius:16px;background:var(--panel-2);border:2px solid transparent;display:flex;flex-direction:column;gap:4px}
.mode-card b{font-family:var(--f-head);font-size:22px}.mode-card span{color:var(--muted);font-size:14px;line-height:1.35}
.mode-card[aria-pressed=true]{border-color:var(--gold);background:#383e49}
.bet-head{display:flex;justify-content:space-between;align-items:baseline;margin:6px 0 8px;font-family:var(--f-head);font-size:20px}
.bet-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}
.bet{padding:10px 4px;border-radius:12px;background:var(--panel-2);border:2px solid transparent;font-family:var(--f-head);font-weight:700;font-size:20px;color:#fff}
.bet[aria-pressed=true]{border-color:var(--gold);background:#3c3a2a;color:var(--gold)}
.bet:disabled{opacity:.35}
.payout{padding:10px 14px;border-radius:12px;background:rgba(244,197,66,.09);border:1px solid rgba(244,197,66,.3);margin-bottom:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.diff-row{display:flex;align-items:center;gap:12px;margin-bottom:12px;color:var(--muted)}

/* ---------- pengaturan, jeda, matchmaking ---------- */
.set-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.06)}
.switch{width:52px;height:30px;border-radius:15px;background:#4a505b;position:relative;transition:background .18s;flex:none}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .18s cubic-bezier(.3,1.3,.5,1)}
.switch[aria-checked=true]{background:var(--ok)}.switch[aria-checked=true]::after{transform:translateX(22px)}
.spinner{width:54px;height:54px;border-radius:50%;border:5px solid rgba(255,255,255,.12);border-top-color:var(--gold);animation:spin 1s linear infinite;margin:6px auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.mm{text-align:center}
.vs{display:flex;align-items:center;justify-content:center;gap:18px;margin:6px 0 10px;font-family:var(--f-head);font-size:22px}
.vs .side{display:flex;flex-direction:column;align-items:center;gap:8px}

/* ---------- avatar, bingkai, badge ---------- */
.avx{--s:44px;--c1:#4a8fd6;--c2:#2b5fa8;--frame:transparent;width:var(--s);height:var(--s);border-radius:50%;background:linear-gradient(145deg,var(--c1),var(--c2));display:grid;place-items:center;color:#fff;position:relative;flex:none;box-shadow:inset 0 -4px 8px rgba(0,0,0,.25),inset 0 2px 4px rgba(255,255,255,.28)}
.avx svg.sym{width:58%;height:58%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
.avx:not([data-frame=none]){box-shadow:0 0 0 calc(var(--s)*.07) var(--frame),0 0 0 calc(var(--s)*.105) rgba(0,0,0,.4)}
.avx[data-frame=neon],.avx[data-frame=diamond],.avx[data-frame=gold]{box-shadow:0 0 0 calc(var(--s)*.07) var(--frame),0 0 0 calc(var(--s)*.105) rgba(0,0,0,.4),0 0 calc(var(--s)*.35) var(--frame)}
.avx .bdg{position:absolute;right:-16%;bottom:-16%;width:44%;height:44%}
.bdgx{display:inline-block;flex:none}
.bdg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg-card{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 8px;border-radius:14px;background:var(--panel-2);border:2px solid transparent;text-align:center;font-size:13px;color:var(--muted)}
.bdg-card b{color:#fff;font-family:var(--f-head);font-size:17px}
.bdg-card.locked{opacity:.45;filter:grayscale(.8)}
.bdg-card[aria-pressed=true]{border-color:var(--gold)}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:10}
#hud>*{pointer-events:auto}
#hudTop{position:absolute;top:0;left:0;right:0;height:var(--hud-h);display:grid;grid-template-columns:auto 1fr auto 1fr;align-items:center;gap:12px;padding:0 74px 0 12px;background:linear-gradient(180deg,rgba(17,20,25,.94),rgba(17,20,25,.74));backdrop-filter:blur(8px);border-bottom:1px solid rgba(255,255,255,.06)}
.hud-menu{width:44px;height:44px;border-radius:12px;background:linear-gradient(#41d85a,#26b13c);display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 2px 0 #167a29}
.hud-player{display:flex;align-items:center;gap:10px;min-width:0}
.hud-player.right{justify-self:end;flex-direction:row-reverse;text-align:right}.hud-player.left{justify-self:start}
.avwrap{position:relative;width:50px;height:50px;flex:none}
.avwrap .avslot{position:absolute;inset:6px;display:grid;place-items:center}
.avwrap svg.ring{position:absolute;inset:0;width:50px;height:50px;transform:rotate(-90deg);pointer-events:none}
.ring-bg{fill:none;stroke:rgba(255,255,255,.1);stroke-width:3}
.ring-fg{fill:none;stroke:var(--ok);stroke-width:3.5;stroke-linecap:round;stroke-dasharray:138.2;stroke-dashoffset:138.2;opacity:0;transition:opacity .2s}
.hud-player.active .ring-fg{opacity:1}.hud-player.urgent .ring-fg{stroke:var(--bad)}
.lvl{position:absolute;left:-4px;bottom:-3px;min-width:20px;height:20px;padding:0 4px;border-radius:10px;background:#1b1f26;border:2px solid var(--gold);color:var(--gold);font:700 11px/16px var(--f-head);text-align:center;z-index:2}
.hud-player.right .lvl{left:auto;right:-4px}
.hud-meta{display:flex;flex-direction:column;gap:5px;min-width:0}
.pname{font-family:var(--f-head);font-weight:700;font-size:19px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22vw}
.tray{display:flex;gap:3px}.hud-player.right .tray{justify-content:flex-end}
.mb{width:15px;height:15px;border-radius:50%;background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.85) 0 10%,transparent 34%),var(--c);box-shadow:0 1px 1px rgba(0,0,0,.4)}
.mb.stripe{background:radial-gradient(circle at 34% 28%,rgba(255,255,255,.85) 0 8%,transparent 26%),linear-gradient(transparent 26%,var(--c) 26% 74%,transparent 74%),#f4f1e8}
.slot{width:15px;height:15px;border-radius:50%;background:rgba(0,0,0,.45);box-shadow:inset 0 1px 2px rgba(0,0,0,.6)}
.conn{display:flex;align-items:flex-end;gap:2px;height:16px;margin-left:6px}.conn i{width:4px;background:var(--ok);border-radius:1px}.conn.off i{background:var(--bad)}
.conn i:nth-child(1){height:6px}.conn i:nth-child(2){height:10px}.conn i:nth-child(3){height:15px}
.pot{display:flex;align-items:center;gap:8px;padding:5px 16px 5px 6px;border-radius:30px;background:linear-gradient(#3a3320,#2a2617);border:1.5px solid rgba(244,197,66,.6);box-shadow:0 0 0 3px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.12)}
.pot b{font-family:var(--f-head);font-size:26px;color:var(--gold);line-height:1;text-shadow:0 1px 0 rgba(0,0,0,.5)}
.pot small{display:block;color:#c9b26a;font-size:11px;line-height:1;margin-top:2px}
#turnChip{position:absolute;top:calc(var(--hud-h) + 8px);left:50%;transform:translateX(-50%);padding:7px 18px;border-radius:20px;background:rgba(20,24,30,.78);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.08);font-family:var(--f-head);font-weight:600;font-size:18px;white-space:nowrap;pointer-events:none;max-width:94vw;text-align:center}
#turnChip.mine{background:rgba(29,120,48,.85)}#turnChip.foul{background:rgba(160,40,44,.9)}
#toast{position:absolute;top:calc(var(--hud-h) + 52px);left:50%;transform:translate(-50%,-8px);padding:9px 18px;border-radius:12px;background:rgba(20,24,30,.94);border:1px solid rgba(255,255,255,.1);font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:88vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}#toast.foul{border-color:var(--bad);color:#ffd5d6}#toast.ok{border-color:var(--ok)}
#power{position:absolute;right:max(8px,env(safe-area-inset-right));top:50%;transform:translateY(-46%);height:64vh;max-height:560px;min-height:180px;width:44px;display:flex;flex-direction:column;align-items:center;gap:8px}
#powerTrack{position:relative;flex:1;width:32px;border-radius:16px;background:linear-gradient(#0d2340,#12305a);border:2px solid #0a1a30;box-shadow:inset 0 3px 8px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.06);touch-action:none;overflow:hidden}
#powerFill{position:absolute;inset:0;background:linear-gradient(180deg,var(--ok) 0%,var(--gold) 55%,var(--bad) 100%);clip-path:inset(0 0 100% 0);opacity:.95}
#powerTrack::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(180deg,transparent 0 22px,rgba(255,255,255,.07) 22px 23px);z-index:2;pointer-events:none}
#powerHandle{position:absolute;left:-3px;right:-3px;height:20px;top:0;margin-top:-10px;border-radius:10px;background:linear-gradient(#fff,#cfd8e3);box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:3}
#power output{font:700 14px var(--f-head);color:var(--muted);min-height:18px}
#hud.locked #power,#hud.locked #spin,#hud.locked #fine{opacity:.35;pointer-events:none}
#spin{position:absolute;width:50px;height:50px;border-radius:50%;background:#dfe6ec;border:3px solid #10151b;box-shadow:0 3px 10px rgba(0,0,0,.5);touch-action:none;overflow:hidden}
#spin canvas{width:100%;height:100%;display:block}
#fine{position:absolute;display:flex;gap:10px}
#fine button{width:56px;height:44px;border-radius:12px;background:rgba(49,54,63,.92);border:1px solid rgba(255,255,255,.1);display:grid;place-items:center;touch-action:none}

/* layout per orientasi (angka disamakan dengan Renderer.layoutFor) */
body[data-layout=wide] #spin{right:12px;top:6px}
body[data-layout=wide] #fine{left:50%;bottom:9px;transform:translateX(-50%)}
body[data-layout=compact]{--hud-h:50px}
body[data-layout=compact] #hudTop{padding-right:12px}
body[data-layout=compact] .avwrap{width:42px;height:42px}body[data-layout=compact] .avwrap svg.ring{width:42px;height:42px}
body[data-layout=compact] #spin{left:10px;top:64px;width:54px;height:54px}
body[data-layout=compact] #fine{left:14px;bottom:12px;flex-direction:column;gap:8px}body[data-layout=compact] #fine button{width:48px;height:38px}
body[data-layout=compact] #power{height:72vh;right:6px}
body[data-layout=portrait]{--hud-h:58px}
body[data-layout=portrait] #hudTop{gap:6px;padding:0 8px}
body[data-layout=portrait] #spin{left:12px;bottom:12px;width:76px;height:76px}
body[data-layout=portrait] #fine{left:110px;bottom:26px}
body[data-layout=portrait] #power{right:5px;height:58vh;width:40px}body[data-layout=portrait] #powerTrack{width:30px}
body[data-layout=portrait] .hud-menu{width:38px;height:38px}
body[data-layout=portrait] .avwrap,body[data-layout=portrait] .avwrap svg.ring{width:40px;height:40px}body[data-layout=portrait] .avwrap .avslot{inset:5px}
body[data-layout=portrait] .pname{font-size:14px;max-width:62px}body[data-layout=portrait] .hud-meta{gap:3px}
body[data-layout=portrait] .slot,body[data-layout=portrait] .mb{width:8px;height:8px}body[data-layout=portrait] .tray{gap:2px}
body[data-layout=portrait] .pot{padding:3px 10px 3px 4px;gap:2px}body[data-layout=portrait] .pot svg{width:26px;height:26px}body[data-layout=portrait] .pot b{font-size:19px}body[data-layout=portrait] .pot small{display:none}
body[data-layout=portrait] .conn{display:none!important}
body[data-layout=portrait] #turnChip{font-size:15px;padding:5px 12px}
.wide-only{display:inline}body[data-layout=portrait] .wide-only{display:none}

/* ---------- Hadiah / level ---------- */
.lvl-card{display:flex;align-items:center;gap:16px;padding:16px;border-radius:18px;background:linear-gradient(135deg,#3a3320,#2a2f38);border:1px solid rgba(244,197,66,.35);margin-bottom:14px}
.lvl-big{width:68px;height:68px;border-radius:50%;display:grid;place-items:center;font:700 32px var(--f-head);color:#3b2a00;background:radial-gradient(circle at 35% 30%,#fff2b0,#F4C542 55%,#b8850c);box-shadow:0 0 0 4px rgba(0,0,0,.3);flex:none}
.xpbar{height:14px;border-radius:7px;background:rgba(0,0,0,.4);overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.6)}
.xpfill{height:100%;width:0;background:linear-gradient(90deg,#2bd4ff,#32D74B);border-radius:7px;transition:width .05s linear}
.daily{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin:10px 0}
.day{padding:10px 2px;border-radius:12px;background:var(--panel-2);text-align:center;border:2px solid transparent;font-size:12px;color:var(--muted)}
.day b{display:block;font:700 16px var(--f-head);color:#fff;margin-top:4px}
.day.today{border-color:var(--gold);background:#3c3a2a}.day.done{opacity:.5}
.rw-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:var(--panel-2);margin-bottom:8px;flex-wrap:wrap}
.rw-lv{width:42px;height:42px;border-radius:50%;background:#1b1f26;border:2px solid var(--gold);display:grid;place-items:center;font:700 18px var(--f-head);color:var(--gold);flex:none}
.rw-items{display:flex;gap:8px;flex-wrap:wrap;flex:1;min-width:150px}
.rw-item{display:flex;align-items:center;gap:6px;padding:4px 10px 4px 4px;border-radius:20px;background:rgba(0,0,0,.28);font-weight:600;font-size:14px;min-height:34px}
.rw-item img{height:22px;width:74px;object-fit:contain}
.rw-item canvas{width:44px;height:auto;border-radius:4px}
.rw-row.locked{opacity:.55}

/* level-up */
.lu{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;width:min(480px,100%);max-height:100%;overflow-y:auto;padding:10px}
.lu-ring{position:relative;width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,#fff2b0,#F4C542 55%,#b8850c);box-shadow:0 0 0 8px rgba(0,0,0,.3),0 0 60px rgba(244,197,66,.55);animation:pop .7s cubic-bezier(.2,1.6,.4,1) both}
.lu-ring::after{content:"";position:absolute;inset:-14px;border-radius:50%;border:3px solid rgba(244,197,66,.6);animation:ripple 1.6s ease-out infinite}
.lu-num{font:700 76px var(--f-head);color:#3b2a00;text-shadow:0 2px 0 rgba(255,255,255,.4)}
@keyframes pop{from{transform:scale(.2);opacity:0}}
@keyframes ripple{from{transform:scale(.9);opacity:.9}to{transform:scale(1.5);opacity:0}}
.lu h2{margin:4px 0 0;font:700 38px var(--f-head)}
.lu-rewards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.lu-card{min-width:112px;padding:12px 10px;border-radius:14px;background:var(--panel);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:600;animation:rise .5s both}
.lu-card img{width:110px;height:20px;object-fit:contain}.lu-card canvas{width:96px;border-radius:4px}
@keyframes rise{from{transform:translateY(16px) scale(.9);opacity:0}}
.lu-card.claimed{animation:claimed .6s both}
@keyframes claimed{50%{transform:scale(1.12);box-shadow:0 0 30px rgba(244,197,66,.6)}}

/* hasil */
.result h2{font-size:42px;text-align:center}
.res-rows{display:flex;flex-direction:column;gap:8px;margin:8px 0 14px}
.res-row{display:flex;justify-content:space-between;align-items:center;font-family:var(--f-head);font-size:20px}
.res-row b{font-size:26px}
.chips-row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px}

/* profil */
.prof-top{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.prof-top input{height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:var(--panel-2);padding:0 12px;width:min(240px,100%)}
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;margin:10px 0 16px}
.pick{position:relative;display:grid;place-items:center;padding:8px 4px;border-radius:14px;background:var(--panel-2);border:2px solid transparent;gap:4px;font-size:11px;color:var(--muted)}
.pick[aria-pressed=true]{border-color:var(--gold)}.pick.locked{opacity:.4}
.pick .lock{position:absolute;top:3px;right:5px;font-size:12px}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.stat-c{padding:12px;border-radius:14px;background:var(--panel-2)}.stat-c small{color:var(--muted);display:block}.stat-c b{font:700 22px var(--f-head)}
h3.sec{font:700 20px var(--f-head);margin:16px 0 6px}

/* peringkat */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:10px;align-items:end;margin:6px 0 16px}
.pod{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px;border-radius:16px;background:var(--panel-2);text-align:center}
.pod.p1{background:linear-gradient(#4a4022,#2a2f38);border:1px solid rgba(244,197,66,.5);padding-bottom:20px}
.pod b{font:700 17px var(--f-head);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pod .medal{font:700 20px var(--f-head);color:var(--gold)}
.lb-row{display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:12px;background:var(--panel-2);margin-bottom:6px}
.lb-row.you{background:#3c3a2a;border:1px solid rgba(244,197,66,.6)}
.lb-rank{width:34px;font:700 18px var(--f-head);color:var(--muted);text-align:center;flex:none}
.lb-name{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lb-name small{display:block;color:var(--muted);font-weight:400}
.lb-val{font:700 19px var(--f-head);color:var(--gold)}

/* toko meja */
.tb-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.tb-card{border-radius:18px;background:var(--panel-2);overflow:hidden;border:2px solid transparent}
.tb-card.equipped{border-color:var(--ok)}
.tb-prev{background:radial-gradient(ellipse at 50% 40%,#2e3542,#1c2028);padding:10px 10px 4px;display:grid;place-items:center;min-height:130px}
.tb-prev canvas{width:100%;height:auto;display:block}
.tb-info{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px}
.tb-info h4{margin:0;font:700 21px var(--f-head);display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.rar{font:600 12px var(--f-body);padding:2px 8px;border-radius:8px;background:rgba(0,0,0,.35)}
.rar.Legendary{color:var(--cue-gold)}.rar.Epic{color:#d99cff}.rar.Rare{color:#8fd4ff}.rar.Kustom{color:var(--ok)}

/* ---------- Cue Collection ---------- */
.cuescreen{background:var(--cue-bg)}
.cue-list{display:flex;flex-direction:column;gap:22px}
.cue-card{flex:none;border-radius:20px;overflow:hidden;background:var(--cue-prev)}
.cue-preview{background:var(--cue-prev);padding:18px 20px 0;display:flex;justify-content:center}
.cue-preview img{width:100%;max-height:120px;height:110px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.55))}
.cue-card.locked .cue-preview img{opacity:.55;filter:grayscale(.5) drop-shadow(0 6px 8px rgba(0,0,0,.55))}
.cue-panel{margin:18px;background:var(--cue-panel);border:1px solid var(--cue-line);border-radius:18px;padding:18px}
.cue-panel h3{margin:0 0 14px;text-align:center;font-family:var(--f-head);font-size:28px;font-weight:700;color:#fff}
.cue-row{display:grid;grid-template-columns:auto minmax(220px,300px) minmax(190px,1fr);gap:18px;align-items:stretch;justify-content:center}
.cue-left{display:flex;flex-direction:column;gap:10px}
.lvl-line{display:flex;align-items:center;gap:10px;font-weight:600;font-size:18px}
.lvl-box{min-width:34px;height:34px;padding:0 8px;border-radius:8px;background:linear-gradient(#26202c,#0d0a11);border:1px solid rgba(255,255,255,.12);box-shadow:inset 0 1px 0 rgba(255,255,255,.18);display:grid;place-items:center;font-weight:700}
.pips{display:flex;gap:4px}.pips i{width:16px;height:5px;border-radius:3px;background:var(--cue-dim)}.pips i.on{background:var(--cue-gold)}
.badges{display:flex;flex-wrap:wrap;gap:8px}.badge{padding:8px 14px;border-radius:8px;background:rgba(0,0,0,.4);color:#fff;font-size:17px}
.badge.r-Legendary{color:var(--cue-gold)}.badge.r-Epic{color:#d99cff}.badge.r-Rare{color:#8fd4ff}.badge.r-Kustom{color:var(--ok)}
.stat-box{border:2px solid var(--cue-gold);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;justify-content:center;gap:5px;background:rgba(0,0,0,.18)}
.stat{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:6px;font-size:14px;font-weight:600}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}.cells i{height:12px;border-radius:2px;background:var(--cue-dim)}.cells i.on{background:var(--cue-green);box-shadow:0 0 4px rgba(57,255,20,.45)}
.cp-box{border:1px solid var(--cue-gold);border-radius:12px;position:relative;overflow:hidden;background:#3d0c4a;min-width:190px}
.cp-box .cp-title{padding:6px 10px;text-align:center;color:var(--cue-gold);font-weight:700;font-size:13px;background:#26002f}
.cp-line{display:flex;justify-content:space-between;gap:12px;padding:6px 12px;color:var(--cue-sec);font-size:16px}.cp-line b{color:var(--cue-gold);font-size:18px;margin-right:38px}
.cp-box svg{position:absolute;right:10px;bottom:8px;width:30px;height:34px}
.cue-actions{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap}

/* ---------- Developer / DIY ---------- */
.dev-grid{display:grid;grid-template-columns:minmax(260px,380px) 1fr;gap:16px;align-items:start}
.form{display:flex;flex-direction:column;gap:10px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.form input[type=text],.form select,.form textarea{height:40px;border-radius:10px;border:1px solid rgba(255,255,255,.12);background:var(--panel-2);padding:0 10px}
.form textarea{height:120px;padding:8px 10px;font-size:12px;font-family:monospace;resize:vertical}
.form input[type=color]{width:100%;height:38px;border:1px solid rgba(255,255,255,.12);border-radius:10px;background:var(--panel-2);padding:2px}
.form input[type=range]{width:100%}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .chk{flex-direction:row;align-items:center;gap:8px;color:#fff;font-size:14px}
.prev-box{background:radial-gradient(ellipse at 50% 40%,#2e3542,#1c2028);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:10px}
.prev-box canvas{width:100%;height:auto;display:block;border-radius:8px}
.filebtn{position:relative;overflow:hidden;display:inline-flex}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.dev-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.dev-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--panel-2)}
.dev-item img,.dev-item canvas{height:28px;width:90px;object-fit:contain}.dev-item span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spec{font-size:13px;line-height:1.5;color:var(--muted);background:rgba(0,0,0,.22);border-radius:12px;padding:12px 14px}
.spec b{color:#fff}
@media (max-width:820px){.cue-row{grid-template-columns:1fr}.cue-left{flex-direction:row;flex-wrap:wrap;align-items:center}.mode-grid{grid-template-columns:1fr}.dev-grid{grid-template-columns:1fr}.bet-grid{grid-template-columns:repeat(4,1fr)}.daily{grid-template-columns:repeat(4,1fr)}}
@media (max-height:520px){.panel{padding:14px}.panel h2{font-size:26px}.logo{font-size:56px}.tag{display:none}.menu-wrap{padding:10px 18px}.mode-card span{display:none}.mode-card{padding:10px}}
@media (prefers-reduced-motion:reduce){.screen,.switch,.switch::after,button{transition:none}.spinner,.dot,.lu-ring::after{animation:none}}

</style>

  <header id="hudTop">
    <button class="hud-menu" id="btnPause" aria-label="Jeda"><svg width="24" height="24" viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="3" rx="1.5" fill="#fff"/><rect x="4" y="10.5" width="16" height="3" rx="1.5" fill="#fff"/><rect x="4" y="16" width="16" height="3" rx="1.5" fill="#fff"/></svg></button>

      <div class="hud-meta"><div class="pname" id="pn0"></div><div class="tray" id="tr0"></div></div>

      <div class="hud-meta"><div class="pname" id="pn1"></div><div class="tray" id="tr1"></div></div>

</div>

  <section class="screen scrim active" id="screenMenu" aria-label="Menu utama">
    <div class="menu-wrap">
      <div class="chips">
        <button class="chip" id="chipProfile" aria-label="Profil"><span id="menuAv"></span><span class="chip-name"><b id="menuName"></b><small id="menuLevel"></small></span></button>
        <div class="chip coins" title="Saldo BCPOOL"><svg width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="10" fill="#F4C542"/><circle cx="11" cy="11" r="6.5" fill="none" stroke="#b8850c" stroke-width="1.6"/></svg><span id="menuCoins"></span></div>
